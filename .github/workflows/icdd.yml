# ICDD export (D-181): container audit in Python and export tests in TypeScript.
# The test container etl/tests/fixtures/icdd/aim-small.icdd is assembled by the export code; vitest guards that it matches the builder,
# pytest then runs the audit (etl/icdd_audit.py) and mutations on it. No DB, no secrets, no production data.
name: icdd

on:
  pull_request:
    paths:
      - "lib/icdd/**"
      - "lib/viewer-icdd*"
      - "app/api/icdd/**"
      - "components/icdd-panel.tsx"
      - "etl/icdd_audit.py"
      - "etl/tests/test_icdd_audit.py"
      - "etl/tests/fixtures/icdd/**"
      - "public/icdd/**"
      - ".github/workflows/icdd.yml"
  push:
    branches: [main]
    paths:
      - "lib/icdd/**"
      - "etl/icdd_audit.py"
      - "etl/tests/fixtures/icdd/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-ts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: vitest (export, check, roundtrip, test container)
        run: npx vitest run lib/icdd lib/viewer-icdd.test.ts

  audit-py:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only the audit dependencies (the whole etl/requirements-dev.txt pulls in ifcopenshell, PyMuPDF, Tesseract).
      - run: pip install "rdflib>=7.0" "pytest>=8.0"
      - name: pytest audit
        run: python -m pytest etl/tests/test_icdd_audit.py -q
      - name: audit of the test container (CLI, exit != 0 on error)
        run: python -m etl.icdd_audit etl/tests/fixtures/icdd/aim-small.icdd --json icdd-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icdd-audit
          path: icdd-audit.json
