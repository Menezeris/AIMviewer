<title>Knižnica požiadaviek</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>/*__DESIGN_KIT__*/</style>

<style>
/* ═══ Appka nad design-kitom ═══════════════════════════════════════════════
   Mená premenných sú z §5 zadania UI; ich hodnoty sú výhradne --ds-* tokeny
   kitu, takže v appke nie je ani jedna natvrdo napísaná farba — okrem troch
   farieb pásiem, ktoré zadanie výslovne pripúšťa. */

/*__ALIASY__*/

:root {
  --nav-sirka: 200px;
  --inspektor-sirka: 184px;
  --inspektor-zbaleny: 30px;
}

/* ── Základ ─────────────────────────────────────────────────────────────── */
body { background: var(--surface-1); color: var(--text-secondary); font-size: 13px; }
h1, h2, h3 { margin: 0; font-weight: 500; }
p { margin: 0; }
.app { min-height: 100vh; display: flex; flex-direction: column; }
.app button { font-family: inherit; font-weight: 400; }
.mono { font-family: var(--font-mono); }
.muted { color: var(--text-muted); }

.ikona { width: 14px; height: 14px; flex: none; stroke-width: 1.75; }
.ikona-12 { width: 12px; height: 12px; }

/* ── Topbar ─────────────────────────────────────────────────────────────── */
.topbar {
  display: flex; align-items: center; gap: 16px; padding: 8px 14px;
  background: var(--surface-2); border-bottom: 0.5px solid var(--border);
  position: sticky; top: 0; z-index: var(--ds-z-nav);
}
.znacka { display: flex; align-items: center; gap: 8px; flex: none; }
.znacka img { width: 22px; height: 22px; display: block; }
.znacka .nazov { color: var(--text-primary); font-size: 13px; font-weight: 500; }
.znacka img.inverzna { display: none; }
[data-theme="dark"] .znacka img.inverzna { display: block; }
[data-theme="dark"] .znacka img.svetla { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .znacka img.inverzna { display: block; }
  :root:not([data-theme="light"]) .znacka img.svetla { display: none; }
}
.topbar-stat { display: flex; gap: 14px; margin-left: auto; align-items: center; flex-wrap: wrap; }
.stat { font-size: 11px; color: var(--text-muted); display: flex; gap: 5px; align-items: baseline; }
.stat b { font-family: var(--font-mono); font-weight: 500; color: var(--text-primary); font-variant-numeric: tabular-nums; }
.stat.varovanie b { color: var(--text-warning); }
.stat.zle b { color: var(--text-danger); }
.app button.tichy {
  min-height: 24px; padding: 2px 8px; font-size: 11px; border-radius: var(--radius);
  border: 0.5px solid var(--border); background: var(--surface-2); color: var(--text-muted);
}
.app button.tichy:hover { color: var(--text-primary); border-color: var(--border-strong); background: var(--surface-3); }
.app button.ulozit {
  min-height: 24px; padding: 2px 10px; font-size: 11px; border-radius: var(--radius);
  border: 0.5px solid var(--text-accent); background: var(--text-accent); color: var(--ds-text-on-brand);
}
.app button.ulozit:disabled { opacity: .4; }
/* [V29] meno autora: podpisuje revíziu v databáze (Q61), pamätá si ho prehliadač */
.app input.autor {
  min-height: 24px; width: 140px; padding: 2px 8px; font-size: 11px; border-radius: var(--radius);
  border: 0.5px solid var(--border); background: var(--surface-1); color: var(--text-primary);
}
.app input.autor.chyba { border-color: var(--ds-danger-border, var(--text-accent)); }
/* [V29, Q64 d] próza sa píše v editore: blok po bloku, nič okolo sa nemení */
.proza textarea {
  display: block; width: 100%; max-width: 78ch; min-height: 3em; margin: 2px 0 8px; padding: 6px 8px;
  font: inherit; font-size: 12px; line-height: 1.5; color: var(--text-primary); resize: vertical;
  border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--surface-1);
}
.proza textarea.zmenene { border-color: var(--text-accent); }
.pruh-vysledok {
  padding: 6px 10px; margin-bottom: 8px; font-size: 11px; border-radius: var(--radius);
  border: 0.5px solid var(--border); background: var(--surface-2); color: var(--text-secondary);
}
.pruh-vysledok.zle { border-color: var(--text-danger); color: var(--text-danger); }
/* náhľad bez servera nemá kam zapisovať — nech to nie je drobným písmom (DECISIONS U15) */
.pruh-nahlad {
  display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap;
  padding: 7px 14px; font-size: 12px; color: var(--text-secondary);
  background: var(--bg-accent); border-bottom: 0.5px solid var(--border);
}
.pruh-nahlad[hidden] { display: none; }   /* `display: flex` by inak prebilo `hidden` */
.pruh-nahlad b { font-weight: 500; color: var(--text-accent); }
.pruh-nahlad code { font-family: var(--font-mono); font-size: 11px; }

/* ── Tri stĺpce ─────────────────────────────────────────────────────────── */
.telo {
  display: grid; grid-template-columns: var(--nav-sirka) minmax(0, 1fr) var(--inspektor-sirka);
  flex: 1; align-items: start;
}
/* zbalený inšpektor je len úzka lišta s ikonou na rozbalenie (kolo 3 §5) */
.telo.insp-zbaleny { grid-template-columns: var(--nav-sirka) minmax(0, 1fr) var(--inspektor-zbaleny); }
@media (max-width: 1080px) { .telo, .telo.insp-zbaleny { grid-template-columns: var(--nav-sirka) minmax(0, 1fr); } }
@media (max-width: 720px) { .telo, .telo.insp-zbaleny { grid-template-columns: minmax(0, 1fr); } }

/* ── Ľavý panel: plochý zoznam registrov ────────────────────────────────── */
.nav {
  padding: 10px 6px 20px; position: sticky; top: 39px; max-height: calc(100vh - 39px); overflow: auto;
  border-right: 0.5px solid var(--border); background: var(--surface-1);
}
@media (max-width: 720px) { .nav { position: static; max-height: none; border-right: 0; border-bottom: 0.5px solid var(--border); } }
.nav-hlavicka { padding: 0 8px 10px; }
.nav-hlavicka .titul { font-size: 11px; color: var(--text-muted); letter-spacing: .06em; }
.nav-hlavicka .zdroj { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 2px; }
/* popisok sa nesmie orezať — radšej zalomí na dva riadky (§7) */
.app .nav button {
  width: 100%; min-height: 26px; padding: 3px 8px; border: 0; background: transparent;
  border-radius: var(--radius); display: flex; align-items: flex-start; gap: 7px;
  font-size: 12px; color: var(--text-secondary); text-align: left; line-height: 1.35;
}
.nav button .ikona { margin-top: 1px; }
.app .nav button:hover { background: var(--surface-3); }
.app .nav button[aria-current="true"] { background: var(--bg-accent); color: var(--text-accent); }
.nav button .stitok { min-width: 0; overflow-wrap: anywhere; }
.nav button .pocet { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.nav button[aria-current="true"] .pocet { color: var(--text-accent); }
.nav button .pocet.varovanie { color: var(--text-warning); }
.nav button .skratka { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
.nav-ciara { height: 0; border-top: 0.5px solid var(--border); margin: 10px 8px; }

/* ── Stredný stĺpec ─────────────────────────────────────────────────────── */
.obsah { padding: 14px 16px 28px; min-width: 0; }
.cesta { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 10px; }
.app .cesta button { min-height: 18px; padding: 0; border: 0; background: none; color: var(--text-muted); font-family: var(--font-mono); font-size: 11px; }
.app .cesta button:hover { color: var(--text-accent); text-decoration: underline; background: none; }

.hlavicka { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; margin-bottom: 12px; }
.hlavicka h1 { font-size: 16px; color: var(--text-primary); font-weight: 500; }
.hlavicka .technicky { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
.hlavicka .vpravo { margin-left: auto; display: flex; gap: 8px; align-items: center; }
/* stránka poznámky: nadpis, pod ním ID a cesta k súboru (kolo 3 §2) */
.hlavicka-poznamky { display: block; margin-bottom: 6px; }
.hlavicka-poznamky .podtitul { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 2px; }

/* záložky stránky poznámky: jeden záznam, viac pohľadov, každý s URL (kolo 3 §1) */
.zalozky-poznamky { display: flex; gap: 2px; border-bottom: 0.5px solid var(--border); margin-bottom: 12px; }
.app button.zalozka-p {
  min-height: 28px; padding: 4px 10px; border: 0; border-bottom: 2px solid transparent; border-radius: 0;
  background: none; font-size: 12px; color: var(--text-muted); margin-bottom: -0.5px;
}
.app button.zalozka-p:hover { color: var(--text-primary); background: none; }
.app button.zalozka-p[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--text-accent); }

/* pásma: jednostranný okraj sa nezaobľuje; medzera 14 px, aby štyri otázky neboli jeden zoznam (kolo 4 §3.1) */
.pasma { display: grid; gap: 14px; }
.pasmo {
  border-left: 3px solid var(--farba, var(--border-strong));
  border-top: 0.5px solid var(--border); border-right: 0.5px solid var(--border); border-bottom: 0.5px solid var(--border);
  border-radius: 0; background: var(--surface-2); padding: 8px 12px;
  /* položka gridu sa bez `min-width: 0` nezmestí pod vlastný obsah: jeden nezalomiteľný riadok
     inak roztiahne celé pásmo pod inšpektor */
  min-width: 0;
}
.pasmo > h2 { font-size: 16px; font-weight: 500; color: var(--text-primary); }
.pasmo > .technicky { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 1px; }
.pasmo > .telo-pasma { margin-top: 8px; }
.pasmo.prazdne > .telo-pasma { font-size: 11px; color: var(--text-muted); }

/* pásmo 4 nie je karta — je to šev na konci */
.sev {
  border-top: 0.5px dashed var(--border-strong); margin-top: 10px; padding-top: 8px;
  display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline;
}
.sev .otazka { font-size: 13px; color: var(--text-muted); }
.sev .doplnok { font-size: 11px; color: var(--text-muted); margin-left: auto; }

/* pruh „kde to sedí" — jeden riadok, 12 px, segmenty sú odkazy (kolo 3 §2.3) */
.pruh { display: flex; flex-wrap: wrap; gap: 2px 5px; align-items: center; margin: 0 0 10px; font-size: 12px; color: var(--text-muted); }
.pruh .oddel { color: var(--text-faint); }
.pruh .tu { font-family: var(--font-mono); color: var(--text-accent); }
.app .pruh button.seg {
  min-height: 18px; padding: 0 3px; border: 0.5px solid transparent; border-radius: var(--radius);
  background: none; font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary);
}
.app .pruh button.seg:hover { color: var(--text-accent); background: none; }
/* visiaci segment: kurzívou, s prerušovaným okrajom — poznámka zatiaľ neexistuje */
.app .pruh button.seg.visiaci { font-style: italic; color: var(--text-muted); border-color: var(--border-strong); border-style: dashed; }
.app .pruh button.pruh-retazec { margin-left: 2px; color: var(--text-muted); }
.app .pruh button.pruh-retazec:hover { color: var(--text-accent); }
.app button.pruh-viac { min-height: 18px; padding: 0 4px; border: 0; background: none; font-size: 11px; color: var(--text-muted); }
.app button.pruh-viac:hover { color: var(--text-accent); text-decoration: underline; background: none; }

/* [PLAN §4b bod 9] citát z účelu užitia, keď cieľ chýba — próza je odpoveď, len ju treba ukázať */
blockquote.citat-preco { margin: 6px 0 0; padding: 8px 10px; border-left: 2px solid var(--farba, var(--border)); background: var(--surface-2); border-radius: 0 var(--radius-sm, 4px) var(--radius-sm, 4px) 0; }
blockquote.citat-preco .text { font-size: 12px; color: var(--text-primary); white-space: pre-wrap; }
blockquote.citat-preco .zdroj { margin-top: 6px; font-size: 11px; color: var(--text-muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
/* kroky kaskády v pásme „Prečo?": čipy ostávajú (kolo 3 §4.3) */
.kroky { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.kroky .sipka-kroku { color: var(--text-faint); font-size: 11px; }
.rola { font-size: 10px; color: var(--text-muted); text-transform: lowercase; }

/* zvislý strom pásiem 2 a 3: riadok na plnú šírku (kolo 3 §4).
   Postupnosť (udalosť → účel → úlohy) nesie zvislá čiara s odsadením 18 px, nie samotný text —
   vecná príslušnosť (kontajner → objekt) je vnorenie a čas je míľnik v riadku výmeny (kolo 4 §3.4). */
.strom, .jednotky { display: block; }
.vetva { border-left: 0.5px solid var(--border-strong); padding-left: 18px; }

/* [U19] výmena je PREDEL v línii: moment odovzdania medzi úlohami, ktoré informáciu vyrábajú,
   a tými, ktoré ju používajú (PAS 6.1.3). Preto je to najsilnejší prvok línie — dvojitá čiara
   cez celú šírku — a nie karta vo vlastnom pásme. */
.app button.predel {
  display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left;
  border: 0; border-top: 0.5px solid var(--border-strong); border-bottom: 0.5px solid var(--border-strong);
  border-radius: 0; background: var(--surface-1); padding: 6px 8px; margin: 8px 0 0;
  font-size: 13px; color: var(--text-secondary); min-height: 30px;
}
.app button.predel:hover { background: var(--surface-3); color: var(--text-primary); }
.app button.predel.tu { background: var(--bg-accent); color: var(--text-accent); }
.app button.p-id {
  min-height: 18px; padding: 0 2px; border: 0; border-radius: var(--radius); background: none;
  font-family: var(--font-mono); font-size: 13px; color: inherit;
}
.app button.p-id:hover { color: var(--text-accent); background: none; text-decoration: underline; }
.predel .oddel { color: var(--text-faint); }
.predel .p-prijemca { color: var(--text-muted); }
.predel .p-pocet { margin-left: auto; font-size: 11px; color: var(--text-muted); }
.predel .p-sipka { font-size: 11px; color: var(--text-muted); }
/* rozbalenie pod predelom: odpoveď na „Čo a ako podrobne?" tam, kde vzniká — farba pásma ostáva,
   aby kaskáda štyroch otázok bola vidieť aj bez samostatnej karty */
.rozbalenie { border-left: 3px solid var(--farba, var(--border-strong)); padding: 6px 0 10px 12px; margin: 0 0 4px; }
.rozbalenie > h3 { font-size: 16px; font-weight: 500; color: var(--text-primary); }
.rozbalenie > .technicky { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin: 1px 0 6px; }
.rozbalenie .objekty { border-left: 0.5px solid var(--border); margin-left: 8px; padding-left: 10px; }
/* iný účel užitia, ktorý si výmenu berie ako vstup — odkaz, nie ďalšia úloha (U19 §4) */
.pouziva-aj { margin-top: 4px; font-size: 11px; color: var(--text-muted); display: flex; flex-wrap: wrap; gap: 4px; align-items: baseline; }
.app button.pouziva-aj-id { min-height: 18px; padding: 0 3px; border: 0; background: none; font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
.app button.pouziva-aj-id:hover { color: var(--text-accent); background: none; }
.riadok-kroku {
  display: flex; gap: 10px; align-items: baseline; min-width: 0;
  border-top: 0.5px solid var(--border); padding: 5px 0; font-size: 12px;
}
.strom > .riadok-kroku:first-child, .jednotky > .riadok-kroku:first-child { border-top: 0; }
.app button.rk-id {
  flex: none; width: 172px; min-height: 18px; padding: 0; border: 0; background: none; text-align: left;
  font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.app button.rk-id:hover { color: var(--text-accent); background: none; }
.riadok-kroku .rk-nazov { flex: 1; min-width: 0; color: var(--text-secondary); }
.riadok-kroku .rk-pozn { flex: none; font-size: 11px; color: var(--text-muted); text-align: right; max-width: 40%; }
.riadok-kroku.tu, .riadok-kroku.jednotka-ohnisko { background: var(--bg-accent); }
.riadok-kroku.tu .rk-id, .riadok-kroku.jednotka-ohnisko .rk-id { color: var(--text-accent); }
.riadok-kroku.visiaci .rk-nazov { font-style: italic; color: var(--text-muted); }
.app .riadok-kroku.visiaci button.rk-id { font-style: italic; color: var(--text-muted); border: 0.5px dashed var(--border-strong); border-radius: var(--radius); padding: 0 3px; width: auto; max-width: 172px; }
.jednotky .riadok-kroku.jednotka { cursor: pointer; }
.jednotky .riadok-kroku.jednotka:hover { background: var(--surface-3); }
.jednotky .riadok-kroku.jednotka-ohnisko:hover { background: var(--bg-accent); cursor: default; }
.jednotka-telo { padding: 4px 0 8px 16px; }
.prepis-povodna { color: var(--text-muted); }
.prepis-nova { margin-left: 4px; color: var(--text-primary); }

/* telo poznámky: próza len na čítanie pod poľami (kolo 3 §2) */
.proza { margin-top: 16px; border-top: 0.5px solid var(--border); padding-top: 10px; }
.proza > h3 { font-size: 12px; color: var(--text-primary); font-weight: 500; }
.proza > h3 .zdroj, .podtitul .revizia { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); font-weight: 400; margin-left: 6px; }
.proza h4 { font-size: 12px; font-weight: 500; color: var(--text-secondary); margin: 10px 0 2px; }
.proza p { font-size: 12px; line-height: 1.5; color: var(--text-secondary); white-space: pre-wrap; max-width: 78ch; }

/* čipy: jedna poznámka žije na jednom mieste, inde je len čip (V21) */
.cipy { display: flex; flex-wrap: wrap; gap: 4px; }
.app button.cip {
  min-height: 22px; display: inline-flex; align-items: baseline; gap: 6px; padding: 2px 7px;
  border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--surface-1);
  font-size: 11px; color: var(--text-secondary);
}
.app button.cip:hover { border-color: var(--text-accent); color: var(--text-accent); }
.app button.cip[aria-current="true"] { background: var(--bg-accent); border-color: var(--text-accent); color: var(--text-accent); }
.app button.cip.visiaci { border-style: dashed; color: var(--text-warning); font-style: italic; }
.cip .cip-chyba { font-style: normal; font-size: 10px; color: var(--text-warning); }
/* hraničný typ sedí na šve dvoch pásiem, preto je v oboch — nie je to duplicita */
.app button.cip.hranicne { border-left-width: 2px; border-left-style: double; }
.cip .cip-id { font-family: var(--font-mono); }
.cip .cip-nazov { color: var(--text-muted); max-width: 24ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app button.cip:hover .cip-nazov { color: inherit; }
.cip .cip-vazba { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }

/* ── Tabuľky (register aj položky) ──────────────────────────────────────── */
.tabulka-obal { overflow-x: auto; border: 0.5px solid var(--border); border-radius: 12px; background: var(--surface-2); }
table.mriezka { border-collapse: collapse; width: 100%; font-size: 12px; }
table.mriezka thead th {
  text-align: left; font-size: 11px; font-weight: 400; color: var(--text-muted);
  padding: 6px 10px; border-bottom: 0.5px solid var(--border); white-space: nowrap;
  position: sticky; top: 0; background: var(--surface-2); z-index: 1;
}
table.mriezka td { padding: 4px 10px; border-top: 0.5px solid var(--border); vertical-align: top; }
table.mriezka tbody tr:first-child td { border-top: 0; }
table.mriezka tbody tr:hover td { background: var(--surface-3); }
table.mriezka tr.vybrany td { background: var(--bg-accent); }
table.mriezka td.mono, table.mriezka th.mono { font-family: var(--font-mono); font-size: 11px; }
table.mriezka th.lepiaci, table.mriezka td.lepiaci {
  position: sticky; left: 0; z-index: 2; background: var(--surface-2);
  box-shadow: 1px 0 0 var(--border);
}
table.mriezka thead th.lepiaci { z-index: 3; }
table.mriezka tbody tr:hover td.lepiaci { background: var(--surface-3); }
table.mriezka tr.vybrany td.lepiaci { background: var(--bg-accent); }
table.mriezka td.prazdna { color: var(--text-faint); }
/* [U13] zoskupenie pod-záznamov: poznámka je obal, nie riadok — preto pruh, nie ďalší záznam */

<script>
(function () {
  "use strict";
  let DATA = JSON.parse(document.getElementById("data").textContent);
  let TYPY = DATA.typy;
  let PASMA = DATA.pasma;
  let POZNAMKY = {};
  let UZLY = {};
  let DIAG_PODLA = {};
  let DIAGNOSTIKY = [];   // platný zoznam: z dokumentu, alebo prepočítaný nad pracovnou kópiou
  // pracovná kópia: editor mení ju, pôvodné dáta ostávajú na porovnanie
  let PRACOVNE = {};
  const ZMENY = [];

  /** Prepočíta odvodené indexy. Po uložení sem príde dokument znova načítaný zo súborov. */
  function naplnData(d) {
    DATA = d;
    TYPY = DATA.typy;
    PASMA = DATA.pasma;
    POZNAMKY = {};
    UZLY = {};
    DIAG_PODLA = {};
    PRACOVNE = {};
    DATA.poznamky.forEach(p => {
      POZNAMKY[p.id] = p;
      PRACOVNE[p.id] = JSON.parse(JSON.stringify(p.data));
      // pod-záznamy majú vlastnú vetvu pracovnej kópie pod `__pod` — pointer `/__pod/<id>/<pole>`
      // je ten istý, ktorý pozná `zapis.uloz_poznamku`, takže sa dajú editovať aj v registri (U13)
      if (p.pod_zaznamy && p.pod_zaznamy.length) {
        PRACOVNE[p.id].__pod = {};
        p.pod_zaznamy.forEach(pz => { PRACOVNE[p.id].__pod[pz.id] = JSON.parse(JSON.stringify(pz.data)); });
      }
    });
    DATA.uzly.forEach(u => { UZLY[u.id] = u; });
    naplnDiagnostiky(DATA.diagnostiky);
  }

  /** Index diagnostík podľa poznámky. Zoznam je buď z dokumentu (súbory), alebo z `/api/kontrola`
      (pracovná kópia so zmenami, ktoré ešte nie sú uložené). */
  function naplnDiagnostiky(zoznam) {
    DIAGNOSTIKY = zoznam || [];
    DIAG_PODLA = {};
    DIAGNOSTIKY.forEach(x => {
      if (!x.note_id) return;
      (DIAG_PODLA[x.note_id] = DIAG_PODLA[x.note_id] || []).push(x);
    });
  }
  naplnData(DATA);
  const OTVORENE = new Set();
  const VYBRANE = new Set();   // hromadná zmena v registri

  const STAV = {
    pohlad: "register", typ: PASMA.poradie[0], poznamka: null, pod: null,
    er: null, polozka: null, zalozka: "poznamky", zalozkaVolena: false, uroven: "warning",
    zalozkaPoznamky: "poznamka",  // stránka poznámky: Poznámka | Reťazec — predvolená je vždy Poznámka (kolo 3 §1)
    retazec: 0,          // ktorá kaskáda, keď poznámka sedí na viacerých
    vymenyRozbalene: null,  // [U19] ktoré predely sú rozbalené; null = predvoľba podľa ohniska
    stlpceNavyse: {},    // typ → true: ukáž aj polia mimo predvolenej zostavy
    vsetkyPolia: false,  // detail: rozbaliť aj prázdne voliteľné polia
    vysledok: null       // hlásenie po uložení do MD
  };
  //: keď stránka beží pod `assetin edit`, môže zapisovať; ako súbor je to náhľad
  const API = { zivy: false, koren: null, nova: false, kontrola: false, zapis: false, autorPovinny: false, vydanie: false };
  /** Meno autora: podpisuje revíziu v databáze (V29, Q61); bez prihlásenia si ho pamätá prehliadač. */
  const AUTOR = { meno: "" };
  try { AUTOR.meno = localStorage.getItem("assetin-autor") || ""; } catch (e) { /* súkromné okno */ }
  /** Kam sa ukladá: databáza (`db:<kód>`) alebo súbory MD v priečinku. */
  const ulozDoKam = () => (API.koren && String(API.koren).indexOf("db:") === 0 ? "do knižnice" : "do MD");
  // prepočet diagnostík nad pracovnou kópiou: „čerstvé" = to, čo by validátor povedal po uložení
  const PREPOCET = { bezi: false, cakajuci: null, cerstve: false, chyba: null };
  // ID nesie cesta súboru a typ priečinok — editor ich nemení (QUESTIONS #10)
  const NEMENITELNE = new Set(["id", "typ"]);
  const SKRYTE_V_REGISTRI = new Set(["typ", "guid", "jazyk", "autor", "licencia", "aliases", "id"]);
  const SKALARNE = new Set(["text", "dlhy-text", "enum", "enum-alebo-text", "cislo", "boolean", "datum"]);
  const PRIEREZOVE = new Set(Object.keys(TYPY).filter(t => TYPY[t].prierezove));

  // ─────────────────────────────────────────────────────────────── pomôcky
  const h = (tag, trieda, text) => {
    const e = document.createElement(tag);
    if (trieda) e.className = trieda;
    if (text != null) e.textContent = text;
    return e;
  };
  /** Ikona z vendorovaného Tabler sprite (outline, dekoratívna). */
  function ikona(meno, trieda) {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("class", "ikona" + (trieda ? " " + trieda : ""));
    s.setAttribute("aria-hidden", "true");
    s.setAttribute("fill", "none");
    s.setAttribute("stroke", "currentColor");
    s.setAttribute("stroke-linecap", "round");
    s.setAttribute("stroke-linejoin", "round");
    const u = document.createElementNS("http://www.w3.org/2000/svg", "use");
    u.setAttribute("href", "#" + meno);
    s.appendChild(u);
    return s;
  }
  /** 1 poznámka · 2 poznámky · 5 poznámok — tvar podľa počtu, nie „poznámok" vždy. */
  function mnozne(n, jedna, malo, vela) {
    if (n === 1) return n + " " + jedna;
    return n + " " + (n >= 2 && n <= 4 ? malo : vela);   // 0 aj 5+ majú genitív množného čísla
  }
  const skrat = (t, max) => { t = String(t == null ? "" : t); return t.length > max ? t.slice(0, max - 1) + "…" : t; };
  const klucCesty = k => (/^\d+$/.test(k) ? Number(k) : k);
  const prazdne = v => v == null || v === "" || (Array.isArray(v) && v.length === 0);

  function citaj(obj, pointer) {
    if (!pointer) return obj;
    return pointer.replace(/^\//, "").split("/").reduce((o, k) => (o == null ? undefined : o[klucCesty(k)]), obj);
  }
  function zapis(obj, pointer, hodnota) {
    const casti = pointer.replace(/^\//, "").split("/");
    const posledny = casti.pop();
    let cur = obj;
    casti.forEach((k, i) => {
      const kk = klucCesty(k);
      if (cur[kk] == null) cur[kk] = /^\d+$/.test(casti[i + 1] != null ? casti[i + 1] : posledny) ? [] : {};
      cur = cur[kk];
    });
    cur[klucCesty(posledny)] = hodnota;
  }
  function textHodnoty(v) {
    if (v == null || v === "") return "";
    if (Array.isArray(v)) return v.map(textHodnoty).join(", ");
    if (typeof v === "object") return Object.keys(v).map(k => k + ": " + textHodnoty(v[k])).join(" · ");
    if (typeof v === "boolean") return v ? "áno" : "nie";
    return String(v);
  }
  const idZOdkazu = v => {
    const m = String(v == null ? "" : v).match(/^\[\[([^\[\]#|]+)(?:#([^\[\]|]+))?/);
    return m ? m[1] : null;
  };
  function idyPola(id, pole) {
    const v = citaj(PRACOVNE[id], "/" + pole);
    const zoznam = Array.isArray(v) ? v : (v == null ? [] : [v]);
    return zoznam.map(idZOdkazu).filter(Boolean);
  }
  const popisokTypu = t => (TYPY[t] && TYPY[t].popisok) || t;
  const ikonaTypu = t => (TYPY[t] && TYPY[t].ikona) || "ti-file";
  const poznamkyTypu = typ => (DATA.registre[typ] || []);
  const jeVKniznici = id => !!POZNAMKY[id];

  /** Kľúč položky IU-O — musí sedieť s Polozka.kluc v schéme, inak neplatia prepisy ER. */
  function klucPolozky(pol) {
    if (!pol) return "";
    if (pol.prop) return idZOdkazu(pol.prop) || String(pol.prop);
    const i = pol.ifc || {};
    if (i.atribut) return i.atribut;
    if (i.material) return "material:" + i.material;
    return i.nazov || "";
  }
  function ifcPopis(pol) {
    const i = (pol && pol.ifc) || null;
    if (!i) return pol && pol.prop ? "vlastná vlastnosť" : "";
    if (i.atribut) return "atribút " + i.atribut;
    if (i.material) return "materiál " + i.material;
    return (i.pset || "") + " · " + (i.nazov || "");
  }

  // ─────────────────────────────────────────────────────────── diagnostiky
  /** Presne na tomto poli. Vnorené sa hlásia na svojom riadku, nie znova na rodičovi —
      inak jeden nález vyzerá ako päť (QUESTIONS §7). */
  /** Bez prepočtu (náhľad bez servera) hovorí diagnostika o súbore, nie o tom, čo je na obrazovke —
      na poli s neuloženou zmenou ju preto zamlčíme, kým sa neuloží (PLAN §4b bod 5). */
  const zastaralaDiag = (id, pointer) => !PREPOCET.cerstve && !!zmenaPre(id, pointer);
  const diagPre = (id, pointer) => zastaralaDiag(id, pointer)
    ? [] : (DIAG_PODLA[id] || []).filter(d => d.json_pointer === pointer);
  const diagPodStrom = (id, pointer) => zastaralaDiag(id, pointer) ? [] : (DIAG_PODLA[id] || []).filter(d =>
    pointer && (d.json_pointer === pointer || d.json_pointer.indexOf(pointer + "/") === 0));
  const najhorsia = zoznam => zoznam.some(d => d.uroven === "E") ? "E" : (zoznam.some(d => d.uroven === "W") ? "W" : (zoznam[0] ? "I" : null));

  // ───────────────────────────────────────────────────────────────── zmeny
  function zmenaPre(id, pointer) { return ZMENY.find(z => z.id === id && z.pointer === pointer); }
  function nastav(id, pointer, hodnota, popis) {
    const povodne = citaj(POZNAMKY[id].data, pointer);
    zapis(PRACOVNE[id], pointer, hodnota);
    const i = ZMENY.findIndex(z => z.id === id && z.pointer === pointer);
    const rovnake = JSON.stringify(povodne === undefined ? null : povodne) === JSON.stringify(hodnota === undefined ? null : hodnota);
    if (rovnake) { if (i >= 0) ZMENY.splice(i, 1); }
    else {
      const z = { id, pointer, titulok: popis ? popis.titulok : pointer, predtym: povodne, teraz: hodnota };
      if (i >= 0) ZMENY[i] = z; else ZMENY.push(z);
    }
    naplanujPrepocet();
    vykresli();
  }

  /** [V29, Q64 d] Zmena jedného bloku prózy: pointer `/__proza/<index bloku v tele>`. Próza nie je
      pole schémy, preto nejde cez `nastav` (to číta a píše `data`); server overí, že text ostal prózou. */
  function nastavProzu(id, blok, text) {
    const pointer = "/__proza/" + blok.i;
    const i = ZMENY.findIndex(z => z.id === id && z.pointer === pointer);
    if (text.trim() === blok.text) { if (i >= 0) ZMENY.splice(i, 1); }
    else {
      const z = { id, pointer, titulok: "próza", predtym: blok.text, teraz: text };
      if (i >= 0) ZMENY[i] = z; else ZMENY.push(z);
    }
    naplanujPrepocet();
  }
  function prozaBlok(id, blok) {
    const t = document.createElement("textarea");
    const zmena = zmenaPre(id, "/__proza/" + blok.i);
    t.value = zmena ? zmena.teraz : blok.text;
    t.rows = Math.min(16, Math.max(2, t.value.split("\n").length + 1));
    t.classList.toggle("zmenene", !!zmena);
    t.setAttribute("aria-label", "próza poznámky");
    // bez prekreslenia pri každom písmene: kurzor ostane, počítadlo zmien sa obnoví pri opustení
    t.addEventListener("input", () => { nastavProzu(id, blok, t.value); t.classList.toggle("zmenene", !!zmenaPre(id, "/__proza/" + blok.i)); });
    t.addEventListener("change", () => vykresli());
    return t;
  }

  /** Diagnostiky platia pre súbory; kým je zmena neuložená, prepočítame ich nad pracovnou kópiou.
      Bez servera (náhľad) sa prepočítať nedajú — vtedy sa aspoň nehlásia na zmenenom poli, aby
      stránka netvrdila o hodnote, ktorú už nemá (PLAN §4b bod 5). */
  function naplanujPrepocet() {
    PREPOCET.cerstve = false;
    if (!API.zivy || !API.kontrola) return;
    if (PREPOCET.cakajuci) clearTimeout(PREPOCET.cakajuci);
    PREPOCET.cakajuci = setTimeout(prepocitajDiagnostiky, 350);
  }

  function prepocitajDiagnostiky() {
    PREPOCET.cakajuci = null;
    if (!API.zivy || !API.kontrola) return;
    if (!ZMENY.length) {                       // späť na pôvodné hodnoty = platí, čo hovoria súbory
      naplnDiagnostiky(DATA.diagnostiky);
      PREPOCET.cerstve = false; PREPOCET.chyba = null;
      vykresli();
      return;
    }
    PREPOCET.bezi = true;
    const telo = { zmeny: ZMENY.map(z => ({ id: z.id, pointer: z.pointer, hodnota: z.teraz })) };
    fetch("api/kontrola", {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(telo)
    })
      .then(r => r.json())
      .then(v => {
        PREPOCET.bezi = false;
        PREPOCET.chyba = v.ok ? null : ("zmenu sa nedá zapísať: " + (v.odmietnute || []).join(", "));
        naplnDiagnostiky(v.diagnostiky || []);
        PREPOCET.cerstve = true;
        vykresli();
      })
      .catch(e => { PREPOCET.bezi = false; PREPOCET.chyba = "prepočet zlyhal: " + e; vykresli(); });
  }
  function chybaPola(popis, hodnota) {
    if (prazdne(hodnota)) return popis.povinne ? "pole je povinné" : null;
    const o = popis.obmedzenia || {};
    if (popis.druh === "enum" && popis.hodnoty.indexOf(hodnota) < 0) return "hodnota nie je v enume §14";
    if (popis.druh === "cislo" && isNaN(Number(hodnota))) return "očakávané číslo";
    if (o.vzor) { try { if (!new RegExp(o.vzor).test(String(hodnota))) return "nesedí so vzorom " + o.vzor; } catch (e) { /* vzor rieši schéma */ } }
    if (popis.druh === "odkaz" || popis.druh === "zoznam-odkazov") {
      const zoznam = Array.isArray(hodnota) ? hodnota : [hodnota];
      for (const v of zoznam) {
        if (typeof v !== "string" || v.charAt(0) === "#") continue;
        if (!/^\[\[[^\[\]]+\]\]$/.test(v)) return "odkaz musí mať tvar [[ID]]";
      }
    }
    return null;
  }

  // ───────────────────────────────────────────────────────────────── téma
  (function tema() {
    const btn = document.getElementById("tema");
    const poradie = ["system", "light", "dark"];
    let volba = "system";
    try { volba = localStorage.getItem("assetin-tema") || "system"; } catch (e) { volba = "system"; }
    const uloz = () => {
      if (volba === "system") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", volba);
      document.documentElement.classList.toggle("dark", volba === "dark");
      btn.textContent = volba === "system" ? "téma: systém" : (volba === "light" ? "téma: svetlá" : "téma: tmavá");
      try { localStorage.setItem("assetin-tema", volba); } catch (e) { /* súkromné okno */ }
    };
    btn.addEventListener("click", () => { volba = poradie[(poradie.indexOf(volba) + 1) % 3]; uloz(); });
    uloz();
  })();

  // ────────────────────────────────────────────────────── uloženie do MD (§1)
  /** Zistí, či stránku servíruje `assetin edit` — vtedy má kam zapisovať. */
  function zistiApi() {
    return fetch("api/stav", { headers: { accept: "application/json" } })
      .then(r => (r.ok ? r.json() : null))
      .then(d => {
        if (d && d.api) {
          API.zivy = true; API.koren = d.koren; API.nova = !!d.nova; API.kontrola = !!d.kontrola;
          API.zapis = d.zapis !== false; API.autorPovinny = !!d.autor_povinny; API.vydanie = !!d.vydanie && API.autorPovinny;
          vykresli();
        }
      })
      .catch(() => { /* otvorené ako súbor — náhľad bez zápisu */ });
  }

  function ulozDoMD() {
    if (!API.zivy || !API.zapis || !ZMENY.length) return;
    if (API.autorPovinny && !AUTOR.meno.trim()) {
      STAV.vysledok = { stav: "zle", text: "neuložené: zadaj vpravo hore svoje meno - podpisuje zmenu v knižnici" };
      vykresli();
      return;
    }
    // [V29] verzia, ktorú stránka ukazovala: ak poznámku medzitým zmenil niekto iný, server vráti 409
    const verzie = {};
    ZMENY.forEach(z => { if (POZNAMKY[z.id] && POZNAMKY[z.id].verzia) verzie[z.id] = POZNAMKY[z.id].verzia; });
    const telo = { zmeny: ZMENY.map(z => ({ id: z.id, pointer: z.pointer, hodnota: z.teraz })), autor: AUTOR.meno.trim(), verzie };
    STAV.vysledok = { stav: "beží", text: "zapisujem " + ulozDoKam() + "…" };
    vykresli();
    fetch("api/save", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(telo)
    })
      .then(r => r.json().then(v => Object.assign(v, { _status: r.status })))
      .then(v => {
        if (v.dokument) naplnData(v.dokument);   // pravda je sklad, nie pracovná kópia
        if (v._status === 409) {
          STAV.vysledok = {
            stav: "zle",
            text: "neuložené: poznámku medzitým zmenil niekto iný (" + v.odmietnute.join(", ") +
              "). Stránka ukazuje jej novú podobu; tvoje zmeny ostali v zozname - skontroluj ich a ulož znova.",
            diagnostiky: v.diagnostiky || []
          };
          vykresli();
          return;
        }
        if (v.detail) {
          STAV.vysledok = { stav: "zle", text: "neuložené: " + v.detail };
          vykresli();
          return;
        }
        if (v.ok) {
          ZMENY.length = 0;
          let text = "zapísané do " + v.zapisane.join(", ");
          if (v.premenovane && v.premenovane.length) {
            text += " · premenované: " + v.premenovane.map(x => x[0] + " → " + x[1]).join(", ");
          }
          STAV.vysledok = { stav: "ok", text };
        } else {
          STAV.vysledok = {
            stav: "zle",
            text: "neuložené: " + v.odmietnute.join(", "),
            diagnostiky: v.diagnostiky || []
          };
        }
        vykresli();
      })
      .catch(e => {
        STAV.vysledok = { stav: "zle", text: "server neodpovedal: " + e };
        vykresli();
      });
  }

  // ─────────────────────────────────────────────────────────────── topbar
  function statistiky() {
    const k = DATA.kniznica;
    const pocty = { E: 0, W: 0, I: 0 };
    DIAGNOSTIKY.forEach(d => { pocty[d.uroven] += 1; });
    const box = document.getElementById("statistiky");
    box.innerHTML = "";
    // kým beží prepočet nad pracovnou kópiou, čísla ešte patria súborom — povedz to nahlas
    const stavDiag = !ZMENY.length ? "" : (PREPOCET.bezi ? " (prepočítavam…)"
      : (PREPOCET.cerstve ? " (s neuloženými zmenami)" : " (podľa súborov)"));
    [["poznámky", k.poznamky, ""], ["odkazy", k.odkazy, ""],
     ["chyby" + stavDiag, pocty.E, pocty.E ? "zle" : ""],
     ["varovania" + stavDiag, pocty.W, pocty.W ? "varovanie" : ""],
     ["zmeny", ZMENY.length, ZMENY.length ? "varovanie" : ""], ["schéma", "v" + k.schema_verzia, ""]
    ].forEach(p => {
      const d = h("div", "stat " + p[2]);
      d.appendChild(h("b", null, String(p[1])));
      d.appendChild(h("span", null, p[0]));
      box.appendChild(d);
    });

    const pruh = document.getElementById("pruh-nahlad");
    pruh.hidden = API.zivy;
    if (!API.zivy && !pruh.childNodes.length) {
      pruh.appendChild(h("b", null, "Náhľad — zmeny sa neukladajú."));
      pruh.appendChild(h("span", null, "Je to jeden súbor bez servera; na zápis do MD spusti"));
      pruh.appendChild(h("code", null, "assetin edit ."));
      pruh.appendChild(h("span", null, "a otvor http://127.0.0.1:8765."));
    }

    const tlacidlo = document.getElementById("ulozit");
    tlacidlo.hidden = !API.zivy || !API.zapis;
    tlacidlo.disabled = !ZMENY.length;
    tlacidlo.textContent = "Uložiť " + ulozDoKam() + (ZMENY.length ? " (" + ZMENY.length + ")" : "");
    const vydat = document.getElementById("vydat");
    vydat.hidden = !API.zivy || !API.vydanie;
    vydat.disabled = ZMENY.length > 0;   // vydáva sa uložený stav, nie pracovná kópia
    const autor = document.getElementById("autor");
    autor.hidden = !API.zivy || !(API.zapis || API.vydanie) || !API.autorPovinny;
    if (document.activeElement !== autor) autor.value = AUTOR.meno;
    autor.classList.toggle("chyba", API.autorPovinny && !AUTOR.meno.trim() && ZMENY.length > 0);
  }

  // ───────────────────────────────────── ľavý panel: plochý zoznam registrov
  function navigacia() {
    const nav = document.getElementById("nav");
    nav.innerHTML = "";
    const hl = h("div", "nav-hlavicka");
    hl.appendChild(h("div", "titul", "KNIŽNICA"));
    hl.appendChild(h("div", "zdroj", "zadanie/ · " + mnozne(DATA.poznamky.length, "poznámka", "poznámky", "poznámok")));
    nav.appendChild(hl);

    const polozka = (o) => {
      const b = h("button", null);
      b.type = "button";
      if (o.aktivne) b.setAttribute("aria-current", "true");
      b.appendChild(ikona(o.ikona));
      b.appendChild(h("span", "stitok", o.stitok));
      if (o.pocet != null) b.appendChild(h("span", "pocet" + (o.varovanie ? " varovanie" : ""), String(o.pocet)));
      if (o.skratka) b.appendChild(h("span", "skratka", o.skratka));
      if (o.titulok) b.title = o.titulok;
      b.addEventListener("click", o.akcia);
      nav.appendChild(b);
      return b;
    };

    // poradie, skupiny, popisky aj ikony sú zo schémy (pasma.py) — tu nie je zoznam typov;
    // oddeľovač stojí tam, kde sa mení rámec normy (kolo 3 §3), bez nadpisov skupín
    let prva = true;
    (PASMA.skupiny || [PASMA.poradie]).forEach(skupina => {
      const viditelne = skupina.filter(typ => poznamkyTypu(typ).length || (TYPY[typ] || {}).poradie_ui < 10);
      if (!viditelne.length) return;
      if (!prva) nav.appendChild(h("div", "nav-ciara"));
      prva = false;
      viditelne.forEach(typ => {
        const ids = poznamkyTypu(typ);
        polozka({
          ikona: ikonaTypu(typ), stitok: popisokTypu(typ), pocet: ids.length,
          titulok: typ + " — " + ((TYPY[typ] || {}).popisok_export || ""),
          aktivne: STAV.pohlad === "register" && STAV.typ === typ,
          akcia: () => { STAV.zalozka = "poznamky"; STAV.zalozkaVolena = false; VYBRANE.clear(); naviguj({ pohlad: "register", typ }); }
        });
      });
    });

    nav.appendChild(h("div", "nav-ciara"));
    const varovania = DIAGNOSTIKY.filter(d => d.uroven === "W").length;
    polozka({
      ikona: "ti-stethoscope", stitok: "Diagnostika", pocet: varovania, varovanie: varovania > 0,
      aktivne: STAV.pohlad === "diagnostika",
      akcia: () => naviguj({ pohlad: "diagnostika" })
    });
    polozka({ ikona: "ti-search", stitok: "Hľadať", skratka: "⌘K", akcia: otvorHladanie });
    if (ZMENY.length) {
      polozka({
        ikona: "ti-alert-triangle", stitok: "Zmeny", pocet: ZMENY.length, varovanie: true,
        aktivne: STAV.pohlad === "zmeny", akcia: () => naviguj({ pohlad: "zmeny" })
      });
    }
  }

  // ───────────────────────────── adresy: každá obrazovka má URL, späť ide prehliadačom (kolo 3 §1)
  const enc = encodeURIComponent;
  const dec = x => { try { return decodeURIComponent(x); } catch (e) { return x; } };
  /** `#/registre/UC` · `#/IU-O-space` · `#/IU-O-space/retazec?r=1` · `#/STD-clenenie/pod/STD-CL-04` */
  function adresa(stav) {
    if (stav.pohlad === "register") return "#/registre/" + enc(stav.typ);
    if (stav.pohlad === "diagnostika") return "#/diagnostika";
    if (stav.pohlad === "zmeny") return "#/zmeny";
    if (stav.pohlad === "podzaznam") return "#/" + enc(stav.poznamka) + "/pod/" + enc(stav.pod);
    let a = "#/" + enc(stav.poznamka) + (stav.zalozkaPoznamky === "retazec" ? "/retazec" : "");
    const dotaz = [];
    if (stav.retazec) dotaz.push("r=" + stav.retazec);
    // `v` = ktoré výmeny sú rozbalené; chýbajúci parameter znamená predvoľbu podľa ohniska,
    // prázdny (`?v=`) znamená „žiadna" — inak by sa poslaný odkaz otvoril inak než u odosielateľa
    if (Array.isArray(stav.vymenyRozbalene)) dotaz.push("v=" + stav.vymenyRozbalene.map(enc).join(","));
    if (dotaz.length) a += "?" + dotaz.join("&");
    return a;
  }
  function citajAdresu(hash) {
    const casti = String(hash || "").replace(/^#\/?/, "").split("?");
    const seg = casti[0].split("/").filter(Boolean).map(dec);
    const dotaz = {};
    (casti[1] || "").split("&").forEach(x => { const kv = x.split("="); if (kv[0]) dotaz[kv[0]] = dec(kv[1] || ""); });
    const prvyTyp = PASMA.poradie[0];
    if (!seg.length) return { pohlad: "register", typ: prvyTyp };
    if (seg[0] === "registre") return { pohlad: "register", typ: TYPY[seg[1]] ? seg[1] : prvyTyp };
    if (seg[0] === "diagnostika") return { pohlad: "diagnostika" };
    if (seg[0] === "zmeny") return { pohlad: "zmeny" };
    if (POZNAMKY[seg[0]]) {
      if (seg[1] === "pod" && seg[2]) return { pohlad: "podzaznam", poznamka: seg[0], pod: seg[2] };
      return {
        pohlad: "poznamka", poznamka: seg[0],
        zalozkaPoznamky: seg[1] === "retazec" ? "retazec" : "poznamka",
        retazec: Number(dotaz.r) || 0,
        vymenyRozbalene: "v" in dotaz ? (dotaz.v ? dotaz.v.split(",") : []) : null
      };
    }
    // pod-záznam podľa vlastného ID (napr. odkaz z inšpektora)
    if (UZLY[seg[0]] && UZLY[seg[0]].rodic) return { pohlad: "podzaznam", poznamka: UZLY[seg[0]].rodic, pod: seg[0] };
    return { pohlad: "register", typ: prvyTyp };
  }
  /** Adresa → STAV → prekreslenie. Volá sa pri štarte a pri každej zmene hashu (aj tlačidlom späť). */
  function pouzitAdresu() {
    const a = citajAdresu(location.hash);
    const inaPoznamka = a.poznamka && a.poznamka !== STAV.poznamka;
    STAV.pohlad = a.pohlad;
    if (a.typ) STAV.typ = a.typ;
    if (a.poznamka) {
      STAV.poznamka = a.poznamka;
      STAV.typ = POZNAMKY[a.poznamka].typ;
      STAV.pod = a.pod || null;
      STAV.zalozkaPoznamky = a.zalozkaPoznamky || "poznamka";
      STAV.retazec = a.retazec || 0;
      STAV.vymenyRozbalene = a.vymenyRozbalene !== undefined ? a.vymenyRozbalene : null;
      if (inaPoznamka) { STAV.polozka = null; STAV.er = vymenyPre(a.poznamka)[0] || null; }
    }
    vykresli();
    // prázdny hash pri štarte dostane kanonickú adresu bez nového záznamu v histórii
    if (!location.hash) { try { history.replaceState(null, "", adresa(STAV)); } catch (e) { /* file:// bez histórie */ } }
    if (inaPoznamka) window.scrollTo({ top: 0, behavior: "smooth" });
  }
  /** Zmení stav a zapíše ho do adresy; prekreslenie príde cez hashchange. */
  function naviguj(zmena) {
    Object.assign(STAV, zmena);
    const a = adresa(STAV);
    if (location.hash === a) vykresli(); else location.hash = a;
  }

  // ─────────────────────────────────────────────────────────── navigovanie
  function otvorPoznamku(id, polozka) {
    if (!POZNAMKY[id]) return;

    naviguj({ pohlad: "poznamka", poznamka: id, typ: POZNAMKY[id].typ, pod: null, zalozkaPoznamky: "poznamka", retazec: 0, vymenyRozbalene: null });
  }
  /** Záložka Reťazec inej jednotky: ohnisko sa presunie a s ním aj URL (kolo 3 §4.2). */
  function otvorRetazec(id) {

    STAV.polozka = null;
    naviguj({ pohlad: "poznamka", poznamka: id, typ: POZNAMKY[id].typ, pod: null, zalozkaPoznamky: "retazec", retazec: 0, vymenyRozbalene: null });
  }
  /** Poznámka alebo pod-záznam — podľa toho, čo za ID stojí. */
  function otvorCokolvek(id) {

  function otvorPod(poznamka, podId) {

  /** Výmeny, ktoré poznámku nesú — kontext, v ktorom platia prepisy ER. */

  /** Čip: jedna poznámka žije na jednom mieste, všade inde je len odkaz naň (V21). */
  function cip(id, vazba, aktivny, moznosti) {
    const o = moznosti || {};
    const p = POZNAMKY[id];
    const uzol = UZLY[id];
    // pod-záznam (GEO profil, STD pravidlo) žije v UZLY, nie v POZNAMKY — nie je to visiaci odkaz
    const pod = !p && uzol && uzol.rodic ? uzol : null;
    const typ = (uzol || p || {}).typ;
    const hranicne = ((TYPY[typ] || {}).hranicne || []).length > 0;

      else if (p) b.appendChild(h("span", "cip-nazov", p.nazov));

      else b.appendChild(h("span", "cip-chyba", "poznámka zatiaľ neexistuje"));

      ? p.typ + " · " + p.nazov + "\n" + p.subor + (vazba ? "\nväzba: " + vazba : "")
      : pod

        : id + " — poznámka zatiaľ neexistuje (varovanie B1)")
      + (hranicne ? "\nhraničný typ — patrí do dvoch pásiem" : "");
    b.addEventListener("click", () => {
      if (p) otvorPoznamku(id);
      else if (UZLY[id] && UZLY[id].rodic) otvorPod(UZLY[id].rodic, id);

  function bunkaSkalara(ctx, popis, pointer, kompakt) {

  function zapniEditor(obal, tlacidlo, ctx, popis, pointer) {
    const hodnota = citaj(PRACOVNE[ctx.id], pointer);
    let vstup;
    if (popis.druh === "enum" || popis.druh === "enum-alebo-text" || popis.druh === "boolean") {
      vstup = h("select", "vstup");
      const moznosti = popis.druh === "boolean" ? [["", "—"], ["true", "áno"], ["false", "nie"]]
        : [["", "—"]].concat((popis.hodnoty || []).map(v => [String(v), String(v)]));
      moznosti.forEach(m => {
        const o = h("option", null, m[1]);
        o.value = m[0];
        vstup.appendChild(o);
      });
      vstup.value = hodnota == null ? "" : String(hodnota);
    } else if (popis.druh === "dlhy-text") {
      vstup = h("textarea", "vstup");
      vstup.value = hodnota == null ? "" : String(hodnota);
    } else {
      vstup = h("input", "vstup" + (popis.kluc === "vzor" ? " mono" : ""));
      vstup.type = popis.druh === "cislo" ? "number" : (popis.druh === "datum" ? "date" : "text");
      if (popis.druh === "cislo") vstup.step = "any";
      vstup.value = hodnota == null ? "" : String(hodnota);
    }
    const zavriBezZmeny = () => { if (vstup.parentNode === obal) obal.replaceChild(tlacidlo, vstup); };
    let hotovo = false;
    const commit = () => {
      if (hotovo) return;
      hotovo = true;
      let v = vstup.value;
      if (v === "") v = null;
      else if (popis.druh === "boolean") v = v === "true";
      else if (popis.druh === "cislo") v = Number(v);
      const povodne = citaj(PRACOVNE[ctx.id], pointer);
      // bez zmeny sa nič neprekresľuje — prekreslenie by zožralo klik, ktorým používateľ odchádza
      if (JSON.stringify(v === undefined ? null : v) === JSON.stringify(povodne === undefined ? null : povodne)) {
        zavriBezZmeny();
        return;
      }
      nastav(ctx.id, pointer, v, popis);
    };
    vstup.addEventListener("blur", commit);
    if (vstup.tagName === "SELECT") vstup.addEventListener("change", commit);
    vstup.addEventListener("keydown", e => {
      if (e.key === "Enter" && popis.druh !== "dlhy-text") { e.preventDefault(); vstup.blur(); }
      if (e.key === "Escape") { e.preventDefault(); hotovo = true; zavriBezZmeny(); }
    });
    obal.replaceChild(vstup, tlacidlo);
    vstup.focus();
    if (vstup.select) vstup.select();
  }

    if (!popis.odvodene && (!jedenOdkaz || !hodnoty.length)) {

      pridaj.title = "Vybrať cieľ odkazu";

  /** Zhrnutie záznamu vo vnorenej tabuľke — [Q44] len z polí, ktoré **nemajú vlastný stĺpec**,
      inak stĺpec „položka" opakuje to, čo stojí hneď vedľa neho. */
  function zhrnutiePolozky(popis, hodnota, stlpce) {
    if (hodnota == null) return "—";
    const uzVidno = new Set((stlpce || []).map(sx => sx.kluc));
    const kandidati = ["id", "kluc", "nazov", "atribut", "stlpec", "metrika", "system", "dok", "iu", "facet", "ev", "typ"];
    const casti = [];
    kandidati.forEach(k => {
      if (uzVidno.has(k)) return;
      if (hodnota[k] != null && typeof hodnota[k] !== "object") casti.push(String(hodnota[k]));
    });
    if (!uzVidno.has("ifc") && hodnota.ifc && typeof hodnota.ifc === "object") {
      const i = hodnota.ifc;
      casti.unshift(i.atribut || (i.pset ? i.pset + " · " + i.nazov : ("material: " + i.material)));
    }
    if (!casti.length) {
      const prvy = Object.keys(hodnota).find(k => !uzVidno.has(k));
      if (prvy) casti.push(prvy + ": " + textHodnoty(hodnota[prvy]));
    }
    return casti.length ? skrat(casti.join(" · "), 72) : "";
  }
  /** Kostra zvoleného variantu únie: diskriminátor, inak jeho povinné kľúče prázdne — bez nich by
      `variantPolozky` nemala podľa čoho variant spoznať a spadla by späť na prvý (REVIEW §1.2). */
  function kostraVariantu(varianta) {
    const data = {};
    if (varianta.diskriminator) data[varianta.diskriminator.kluc] = varianta.diskriminator.hodnota;
    else (varianta.povinne_kluce || []).forEach(k => { data[k] = ""; });
    return data;
  }

  function variantPolozky(popis, hodnota) {
    if (!popis.varianty) return null;
    for (const v of popis.varianty) {
      if (v.diskriminator && hodnota && hodnota[v.diskriminator.kluc] === v.diskriminator.hodnota) return v;
    }
    for (const v of popis.varianty) {
      if (hodnota && v.povinne_kluce.length && v.povinne_kluce.every(k => hodnota[k] != null)) return v;
    }
    return popis.varianty[0];
  }

  /** Detail jedného záznamu zoznamu: prepínač variantu (únie) + všetky polia. */
  function detailZaznamu(ctx, popis, hodnota, cestaPolozky) {

        o2.value = v.nazov;
        if (v.nazov === varianta.nazov) o2.selected = true;
        sel.appendChild(o2);
      });
      sel.addEventListener("change", () => {
        const novy = popis.varianty.find(v => v.nazov === sel.value);

    polia.forEach(p => {

      detail.appendChild(poleRiadok(ctx, p, cestaPolozky + "/" + p.kluc));

  function tlacidloZmazat(ctx, popis, pointer, hodnoty, i) {
