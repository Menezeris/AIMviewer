  // ─────────────────────────────────────────── nová poznámka zo šablóny (F3)
  /** Povinné polia hlavičky typu ako plochý zoznam (vnorený objekt → jeho povinné polia);
      nič z toho nie je napísané pre konkrétny typ — je to schéma. */
  /** Prvý segment JSON pointra — pole poznámky, na ktoré diagnostika padá. */
  const topKluc = pointer => {
    const seg = String(pointer || "").replace(/^\//, "").split("/")[0];
    return seg && seg.charAt(0) !== "#" ? seg : "";
  };

  function poliaNovej(polia, predpona) {
    const out = [];
    (polia || []).forEach(f => {
      if (f.zdroj !== "frontmatter" || !f.povinne || f.odvodene) return;
      if (!predpona && NEMENITELNE.has(f.kluc)) return;
      if (!predpona && f.kluc === "nazov") return;
      if (f.druh === "objekt") { poliaNovej(f.polia, (predpona || "") + f.kluc + "/").forEach(x => out.push(x)); return; }
      out.push(Object.assign({}, f, { cesta: (predpona || "") + f.kluc }));
    });
    return out;
  }

  /** Vstup pre jedno pole dialógu podľa druhu zo schémy; vráti {prvok, hodnota()}. */
  function vstupNovej(f, predvolba) {
    const enumove = f.druh === "enum" ? f.hodnoty : (f.druh === "zoznam-textov" && f.polozka && f.polozka.druh === "enum" ? f.polozka.hodnoty : null);
    if (enumove) {
      const sel = h("select", "vstup");
      [""].concat(enumove.map(String)).forEach(v => { const o = h("option", null, v || "—"); o.value = v; sel.appendChild(o); });
      if (predvolba != null) sel.value = String(Array.isArray(predvolba) ? predvolba[0] : predvolba);
      return { prvok: sel, hodnota: () => (sel.value === "" ? null : (f.druh === "zoznam-textov" ? [sel.value] : sel.value)) };
    }
    const vstup = h("input", "vstup" + (f.druh === "odkaz" || f.druh === "zoznam-odkazov" ? " mono" : ""));
    vstup.type = f.druh === "cislo" ? "number" : (f.druh === "datum" ? "date" : "text");
    if (predvolba != null) vstup.value = Array.isArray(predvolba) ? predvolba.join(", ") : String(predvolba);
    if (f.druh === "odkaz") vstup.placeholder = "[[ID]]";
    if (f.druh.indexOf("zoznam") === 0) vstup.placeholder = "hodnoty oddelené čiarkou";
    return {
      prvok: vstup,
      hodnota: () => {
        const v = vstup.value.trim();
        if (!v) return null;
        if (f.druh.indexOf("zoznam") === 0) return v.split(",").map(x => x.trim()).filter(Boolean);
        if (f.druh === "cislo") return Number(v);
        return v;
      }
    };
  }

  function otvorNovuPoznamku(predvolenyTyp) {
    const prekryv = h("div", "prekryv");
    const dialog = h("div", "dialog");
    const hlava = document.createElement("header");
    hlava.appendChild(h("h2", null, "Nová poznámka zo šablóny"));
    hlava.appendChild(h("p", null, "ID nesie cesta súboru a neskôr sa nemení; polia sú povinné polia hlavičky typu zo schémy"));
    dialog.appendChild(hlava);
    const formular = h("div", "formular");
    dialog.appendChild(formular);
    const noha = document.createElement("footer");
    const hlasenie = h("span", "nahlad");
    noha.appendChild(hlasenie);
    const zrus = h("button", "mini");
    zrus.type = "button";
    zrus.textContent = "zrušiť";
    const potvrd = h("button", "hlavne");
    potvrd.type = "button";
    potvrd.textContent = "založiť";
    noha.appendChild(zrus);
    noha.appendChild(potvrd);
    dialog.appendChild(noha);
    prekryv.appendChild(dialog);
    document.getElementById("app").appendChild(prekryv);

    const zavri = () => { prekryv.parentNode.removeChild(prekryv); document.removeEventListener("keydown", naKlaves); };
    const naKlaves = e => { if (e.key === "Escape") zavri(); };
    document.addEventListener("keydown", naKlaves);
    zrus.addEventListener("click", zavri);
    prekryv.addEventListener("click", e => { if (e.target === prekryv) zavri(); });

    let typ = TYPY[predvolenyTyp] ? predvolenyTyp : PASMA.poradie[0];
    let vstupy = [];
    // [PLAN §4b bod 4, Q43] polia, ktoré si vypýtal validátor nad kandidátom — register pravidiel je
    // jediný nositeľ toho, čo je povinné navyše; schéma o tom druhú kópiu nedrží
    let ziadane = [];
    let nalezy = [];
    let cakajuciDotaz = null;
    let idV = null, nazovV = null;
    /** Čo má autor v dialógu napísané — prekreslenie (pribudlo pole) mu to nesmie zmazať. */
    function stavDialogu() {
      const s = { id: idV ? idV.value : null, nazov: nazovV ? nazovV.value : null, data: {} };
      vstupy.forEach(x => { const v = x.v.hodnota(); if (v != null) s.data[x.f.cesta] = v; });
      return s;
    }
    const riadok = (kluc, titulok, prvok, popis) => {
      const r = h("div", "pole");
      const m = h("div", "menovka");
      m.appendChild(h("span", "kluc", kluc));
      m.appendChild(h("span", "titulok", titulok));
      r.appendChild(m);
      const hod = h("div", null);
      hod.appendChild(prvok);
      if (popis) hod.appendChild(h("div", "pod-hodnotou", popis));
      r.appendChild(hod);
      return r;
    };
    function prekresli(stav) {
      formular.innerHTML = "";
      vstupy = [];
      const drzane = (stav && stav.data) || {};
      const selTyp = h("select", "vstup");
      PASMA.poradie.forEach(t => { const o = h("option", null, popisokTypu(t) + " · " + t); o.value = t; if (t === typ) o.selected = true; selTyp.appendChild(o); });
      selTyp.addEventListener("change", () => { typ = selTyp.value; prekresli(); });
      formular.appendChild(riadok("typ", "Typ", selTyp, "priečinok podľa typu (PathScheme)"));
      idV = h("input", "vstup mono");
      idV.value = (stav && stav.id != null) ? stav.id : ((DATA.navrhy_id && DATA.navrhy_id[typ]) || "");
      idV.placeholder = typ + "-…";
      formular.appendChild(riadok("id", "ID", idV, DATA.navrhy_id && DATA.navrhy_id[typ] ? "návrh: ďalšie voľné číslo; prepíš, ak treba" : "slug za prefixom typu, napr. " + typ + "-nieco"));
      nazovV = h("input", "vstup");
      if (stav && stav.nazov != null) nazovV.value = stav.nazov;
      formular.appendChild(riadok("nazov", "Názov", nazovV, "ide aj do názvu súboru: ID Názov.md"));
      const predvolby = DATA.predvolby_novej || {};
      const povinne = poliaNovej((TYPY[typ] || {}).polia);
      const uz = new Set(povinne.map(f => f.cesta));
      const navyse = ziadane
        .filter(kluc => !uz.has(kluc))
        .map(kluc => ((TYPY[typ] || {}).polia || []).find(f => f.kluc === kluc && !f.odvodene))
        .filter(Boolean)
        .map(f => Object.assign({}, f, { cesta: f.kluc, ziadane: true }));
      povinne.concat(navyse).forEach(f => {
        const v = vstupNovej(f, drzane[f.cesta] !== undefined ? drzane[f.cesta] : predvolby[f.cesta]);
        vstupy.push({ f, v });
        const dovod = f.ziadane
          ? (nalezy.filter(d => topKluc(d.json_pointer) === f.cesta).map(d => d.kod + " · " + d.sprava).join(" · ") || f.popis)
          : f.popis;
        formular.appendChild(riadok(f.cesta + (f.ziadane ? " ⚑" : ""), f.titulok, v.prvok, dovod));
      });
      vstupy.forEach(x => x.v.prvok.addEventListener("input", naplanujKontrolu));
      vstupy.forEach(x => x.v.prvok.addEventListener("change", naplanujKontrolu));
      idV.addEventListener("input", naplanujKontrolu);
      nazovV.addEventListener("input", naplanujKontrolu);
      if (nalezy.length) {
        const box = h("div", "hlasenia");
        nalezy.forEach(d => box.appendChild(h("div", "diag " + d.uroven,
          d.kod + " " + (d.json_pointer || "") + " · " + d.sprava)));
        formular.appendChild(box);
      }

      function naplanujKontrolu() {
        if (!API.kontrola) return;
        if (cakajuciDotaz) clearTimeout(cakajuciDotaz);
        cakajuciDotaz = setTimeout(skontrolujKandidata, 350);
      }
      /** Spýta sa validátora, čo by povedal o poznámke, ktorá ešte neexistuje — nič sa nezapisuje. */
      function skontrolujKandidata() {
        cakajuciDotaz = null;
        const id = idV.value.trim();
        // kým povinné polia hlavičky nie sú vyplnené, kandidát sa nenatypuje a pravidlá naň nedobehnú —
        // vtedy sa netreba pýtať, formulár ich pýta sám
        if (!id || !nazovV.value.trim()) return;
        if (vstupy.some(x => x.f.povinne && !x.f.ziadane && prazdne(x.v.hodnota()))) return;
        fetch("api/kontrola", {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ zmeny: [], nova: { typ, id, nazov: nazovV.value.trim(), data: zbierData() } })
        })
          .then(r => r.json())
          .then(v => {
            nalezy = (v.diagnostiky || []).filter(d => d.note_id === id && d.uroven !== "I");
            const nove = nalezy.map(d => topKluc(d.json_pointer)).filter(Boolean);
            const pribudlo = nove.filter((x, i) => nove.indexOf(x) === i && ziadane.indexOf(x) < 0);
            nove.forEach(x => { if (ziadane.indexOf(x) < 0) ziadane.push(x); });
            const aktivny = document.activeElement;
            const kluc = aktivny === idV ? "__id" : (aktivny === nazovV ? "__nazov"
              : (vstupy.find(x => x.v.prvok === aktivny) || {}).f);
            prekresli(stavDialogu());
            if (kluc === "__id") idV.focus();
            else if (kluc === "__nazov") nazovV.focus();
            else if (kluc) {
              const x = vstupy.find(y => y.f.cesta === kluc.cesta);
              if (x) x.v.prvok.focus();
            }
            if (pribudlo.length) hlasenie.textContent = "validátor žiada aj: " + pribudlo.join(", ");
          })
          .catch(() => { /* bez servera dialóg neexistuje */ });
      }
      function zbierData() {
        const data = {};
        vstupy.forEach(x => {
          const hodnota = x.v.hodnota();
          if (hodnota == null) return;
          zapis(data, "/" + x.f.cesta, hodnota);
        });
        return data;
      }
      potvrd.onclick = () => {
        const data = zbierData();
        hlasenie.textContent = "zakladám…";
        fetch("api/nova", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ typ, id: idV.value.trim(), nazov: nazovV.value.trim(), data, autor: AUTOR.meno.trim() })
        })
          .then(r => r.json())
          .then(v => {
            if (v.dokument) naplnData(v.dokument);
            if (v.ok) {
              zavri();
              STAV.vysledok = { stav: "ok", text: "založené: " + v.vytvorene.join(", ") };
              otvorPoznamku(idV.value.trim());
            } else {
              hlasenie.textContent = "";
              const zoznam = h("div", "hlasenia");
              if (v.detail) zoznam.appendChild(h("div", "diag E", String(v.detail)));
              (v.diagnostiky || []).forEach(d => zoznam.appendChild(h("div", "diag " + d.uroven, d.kod + " " + (d.json_pointer || "") + " · " + d.sprava)));
              formular.appendChild(zoznam);
              vykresli();
            }
          })
          .catch(e => { hlasenie.textContent = "server neodpovedal: " + e; });
      };
    }
    prekresli();
  }

  // ────────────────────────────────────────────────────────── hľadanie ⌘K
  function otvorHladanie() {
    const prekryv = h("div", "prekryv");
    const dialog = h("div", "dialog");
    const hlava = document.createElement("header");
    hlava.appendChild(h("h2", null, "Hľadať v knižnici"));
    hlava.appendChild(h("p", null, "ID, názov alebo typ poznámky; Enter otvorí prvý výsledok"));
    dialog.appendChild(hlava);
    const hladanie = h("div", "hladanie");
    const vstup = h("input", "vstup");
    vstup.type = "search";
    vstup.placeholder = "napr. space, plocha, ER…";
    hladanie.appendChild(vstup);
    dialog.appendChild(hladanie);
    const zoznam = h("div", "zoznam");
    zoznam.style.maxHeight = "48vh";
    dialog.appendChild(zoznam);
    prekryv.appendChild(dialog);
    document.getElementById("app").appendChild(prekryv);

    const zavri = () => { prekryv.parentNode.removeChild(prekryv); document.removeEventListener("keydown", naKlaves); };
    const naKlaves = e => { if (e.key === "Escape") zavri(); };
    document.addEventListener("keydown", naKlaves);
    prekryv.addEventListener("click", e => { if (e.target === prekryv) zavri(); });

    let prve = null;
    function prekresli() {
      const f = vstup.value.trim().toLowerCase();
      zoznam.innerHTML = "";
      prve = null;
      DATA.poznamky
        .filter(p => !f || p.id.toLowerCase().indexOf(f) >= 0 || String(p.nazov).toLowerCase().indexOf(f) >= 0 ||
                     String(p.typ).toLowerCase().indexOf(f) >= 0)
        .slice(0, 40)
        .forEach(p => {
          const b = h("button", "volba");
          b.type = "button";
          b.appendChild(h("span", null, p.id));
          b.appendChild(h("span", "meta", popisokTypu(p.typ) + " · " + skrat(p.nazov, 34)));
          b.addEventListener("click", () => { zavri(); otvorPoznamku(p.id); });
          if (!prve) prve = p.id;
          zoznam.appendChild(b);
        });
      if (!zoznam.childNodes.length) zoznam.appendChild(h("div", "prazdno", "nič nesedí"));
    }
    vstup.addEventListener("input", prekresli);
    vstup.addEventListener("keydown", e => { if (e.key === "Enter" && prve) { zavri(); otvorPoznamku(prve); } });
    prekresli();
    vstup.focus();
  }
  document.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      otvorHladanie();
    }
  });

  // ══════════════════════════════════════════════════════ pravý panel: inšpektor
  function blok(nadpis) {
    const b = h("div", "insp-blok");
    b.appendChild(h("h3", null, nadpis));
    return b;
  }
  function riadokOdkazu(box, id, dovod, akcia) {
    const riadok = h("div", "insp-riadok");
    const b = h("button", "odkaz-insp");
    b.type = "button";
    b.textContent = id;
    b.title = dovod || id;
    b.addEventListener("click", akcia);
    riadok.appendChild(b);
    if (dovod) riadok.appendChild(h("div", "dovod", dovod));
    box.appendChild(riadok);
  }

  /** Prvý blok: pôvod hodnoty. Pre typy bez položiek ukáže to, čo pre ne dáva zmysel — obsah
      prichádza z engine (`prazdny_stav`), stránka nepozná typy (kolo 3 §5, zásada 3). */
  function blokPovodu(id, data) {
    const p = POZNAMKY[id];
    const polozky = data.polozky || [];
    const vybrana = STAV.polozka ? polozky.find(x => x.polozka === STAV.polozka) : null;

    if (vybrana) {
      const b = blok("PÔVOD HODNOTY");
      b.appendChild(h("div", "nazov-polozky", vybrana.polozka));
      const s = vybrana.suhrn;
      const veta = h("div", "veta");
      if (s.druh === "prepis" && s.povodna_hodnota != null) {
        veta.appendChild(h("s", null, String(s.povodna_hodnota) + " v knižnici"));
        veta.appendChild(document.createTextNode(" → "));
        veta.appendChild(h("b", null, String(vybrana.hodnota.povinnost != null ? vybrana.hodnota.povinnost : "")));
        veta.appendChild(document.createTextNode(" pre túto výmenu"));
      } else {
        veta.textContent = s.popis;
      }
      b.appendChild(veta);
      const ostatne = Object.keys(vybrana.povod).filter(k => vybrana.povod[k].druh !== "vlastne" && vybrana.povod[k] !== s);
      if (ostatne.length && STAV.viacPovodov) {
        ostatne.forEach(k => b.appendChild(h("div", "veta", k + ": " + vybrana.povod[k].popis)));
      }
      if (ostatne.length) {
        const viac = h("button", "zbalene");
        viac.type = "button";
        viac.textContent = STAV.viacPovodov ? "menej" : mnozne(ostatne.length, "ďalší pôvod", "ďalšie pôvody", "ďalších pôvodov");
        viac.addEventListener("click", () => { STAV.viacPovodov = !STAV.viacPovodov; vykresli(); });
        b.appendChild(viac);
      }
      return b;
    }

    if (polozky.length) {
      const b = blok("PÔVOD HODNOTY");
      b.appendChild(h("div", "prazdno", "Klikni na položku v tabuľke — panel povie, či je vlastná, prepísaná výmenou, alebo prišla z pravidla, definície či slovníka."));
      return b;
    }

    const stav = data.prazdny_stav;
    if (stav) {
      const b = blok(stav.nadpis);
      if (!stav.riadky.length) b.appendChild(h("div", "prazdno", stav.prazdno || "Zatiaľ nič."));
      stav.riadky.forEach(rr => riadokOdkazu(b, rr.id, rr.dovod, () => otvorCokolvek(rr.id)));
      return b;
    }
    if (data.geometria) {
      const b = blok("PÔVOD HODNOTY");
      b.appendChild(h("div", "nazov-polozky", "geometria"));
      b.appendChild(h("div", "veta", data.geometria.popis));
      return b;
    }
    const b = blok("ČO TÁTO POZNÁMKA NESIE");
    b.appendChild(h("div", "prazdno", "Typ " + (p ? p.typ : "?") + " nemá položky — pôvod hodnoty sa počíta na objektoch a kontajneroch."));
    return b;
  }

  // stav zbalenia si panel pamätá per druh obrazovky: pri tabuľke registra predvolene zbalený,
  // pri poznámke rozbalený (kolo 3 §5)
  const INSPEKTOR = { register: false, poznamka: true };
  try { Object.assign(INSPEKTOR, JSON.parse(localStorage.getItem("assetin-inspektor") || "{}")); } catch (e) { /* súkromné okno */ }
  function nastavInspektor(druh, otvoreny) {
    INSPEKTOR[druh] = otvoreny;
    try { localStorage.setItem("assetin-inspektor", JSON.stringify(INSPEKTOR)); } catch (e) { /* súkromné okno */ }
  }

  function inspektorPanel() {
    const box = document.getElementById("inspektor");
    box.innerHTML = "";
    const id = (STAV.pohlad === "poznamka" || STAV.pohlad === "podzaznam") ? STAV.poznamka : null;
    const druh = id && POZNAMKY[id] ? "poznamka" : "register";
    const otvoreny = !!INSPEKTOR[druh];
    box.classList.toggle("zbaleny", !otvoreny);
    document.querySelector(".telo").classList.toggle("insp-zbaleny", !otvoreny);

    // prepínač bez `title`: natívny tooltip by prekrýval panel (kolo 3 §5)
    const hlava = h("div", "insp-hlava");
    const prep = h("button", "ikonka insp-prepinac");
    prep.type = "button";
    prep.setAttribute("aria-expanded", String(otvoreny));
    prep.setAttribute("aria-label", otvoreny ? "Zbaliť inšpektor" : "Rozbaliť inšpektor");
    prep.appendChild(ikona(otvoreny ? "ti-layout-sidebar-right-collapse" : "ti-layout-sidebar-right-expand"));
    prep.addEventListener("click", () => { nastavInspektor(druh, !otvoreny); vykresli(); });
    hlava.appendChild(prep);
    box.appendChild(hlava);
    if (!otvoreny) return;

    if (!id || !POZNAMKY[id]) {
      const b = blok("INŠPEKTOR");
      b.appendChild(h("div", "prazdno", "Otvor poznámku. Panel povie, odkiaľ je hodnota, ktoré pravidlá na ňu dopadajú a čoho sa zmena dotkne."));
      box.appendChild(b);
      return;
    }
    const r = aktualnyRetazec(id);
    const poz = r && (r.pozicie || []).find(p => p.vymena);
    const erId = poz ? poz.vymena : (vymenyPre(id)[0] || null);
    const data = (erId && DATA.inspektor_er[erId + "|" + id]) || POZNAMKY[id].inspektor || {};

    box.appendChild(blokPovodu(id, data));

    const b2 = blok("PRAVIDLÁ, KTORÉ NA TO DOPADAJÚ");
    const pravidla = data.pravidla || [];
    if (!pravidla.length) b2.appendChild(h("div", "prazdno", "Žiadne — pravidlo s rozsahom pre tento typ zatiaľ neexistuje."));
    pravidla.forEach(x => riadokOdkazu(b2, x.pravidlo, x.dovod, () => otvorPod(x.poznamka, x.pravidlo)));
    box.appendChild(b2);

    const spat = data.odkazuje_sem || [];
    const podlaId = {};
    spat.forEach(o => { (podlaId[o.id] = podlaId[o.id] || []).push(o.pole); });
    const kluce = Object.keys(podlaId);
    const b3 = blok("ODKAZUJE SEM · " + kluce.length);
    if (!kluce.length) b3.appendChild(h("div", "prazdno", "Nikto."));
    kluce.forEach(x => riadokOdkazu(b3, x, podlaId[x].join(", "), () => otvorPoznamku(x)));
    box.appendChild(b3);

    const b4 = blok("AK ZMENÍM");
    const dopad = data.dopad || {};
    b4.appendChild(h("div", "dopad", dopad.veta || "—"));
    // engine vracia mená, nielen počet — bez nich sa „dotkne sa 1 výmeny cez 4 poznámky" nedá overiť
    const dotknuteVymeny = dopad.vymeny || [];
    (dopad.poznamky || [])
      .slice()
      .sort((a, b) => (dotknuteVymeny.indexOf(b) >= 0) - (dotknuteVymeny.indexOf(a) >= 0))
      .forEach(x => riadokOdkazu(b4, x, dotknuteVymeny.indexOf(x) >= 0 ? "výmena" : "", () => otvorPoznamku(x)));
    box.appendChild(b4);
  }

  // ────────────────────────────────────────────────────────── vykresľovanie
  function vykresli() {
    statistiky();
    navigacia();
    const plocha = document.getElementById("obsah");
    plocha.innerHTML = "";
    if (STAV.vysledok) {
      const pruh = h("div", "pruh-vysledok" + (STAV.vysledok.stav === "zle" ? " zle" : ""));
      pruh.appendChild(h("span", null, STAV.vysledok.text));
      (STAV.vysledok.diagnostiky || []).forEach(d =>
        pruh.appendChild(h("div", "diag " + d.uroven, d.kod + " · " + d.sprava)));
      plocha.appendChild(pruh);
    }
    if (STAV.pohlad === "register") pohladRegistra(plocha);
    else if (STAV.pohlad === "poznamka") pohladPoznamky(plocha);
    else if (STAV.pohlad === "podzaznam") pohladPodZaznamu(plocha);
    else if (STAV.pohlad === "diagnostika") pohladDiagnostiky(plocha);
    else if (STAV.pohlad === "zmeny") pohladZmien(plocha);
    inspektorPanel();
  }

  document.getElementById("ulozit").addEventListener("click", ulozDoMD);
  /** [V29, Q60] Vydanie: kód zvolí vydavateľ; server overí 0 chýb, zmrazí revízie a zapíše IDS do AIM. */
  document.getElementById("vydat").addEventListener("click", () => {
    if (!AUTOR.meno.trim()) {
      STAV.vysledok = { stav: "zle", text: "nevydané: zadaj vpravo hore svoje meno - podpisuje vydanie" };
      vykresli();
      return;
    }
    const dnes = new Date();
    const navrh = dnes.getFullYear() + "." + (dnes.getMonth() + 1) + "." + dnes.getDate();
    const kod = window.prompt("Kód vydania (zmrazí aktuálny stav knižnice a zapíše IDS do katalógu AIM):", navrh);
    if (!kod || !kod.trim()) return;
    STAV.vysledok = { stav: "beží", text: "vydávam " + kod.trim() + "…" };
    vykresli();
    fetch("api/vydaj", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ kod: kod.trim(), autor: AUTOR.meno.trim() })
    })
      .then(r => r.json())
      .then(v => {
        const chyby = (v.chyby || []).map(d => Object.assign({}, d));
        STAV.vysledok = {
          stav: v.ok ? "ok" : "zle",
          text: (v.ok ? "" : "nevydané: ") + (v.sprava || v.detail || "") +
            ((v.ids || []).length ? " · " + v.ids.map(i => i.code + " " + i.zmena).join(", ") : ""),
          diagnostiky: chyby
        };
        vykresli();
      })
      .catch(e => { STAV.vysledok = { stav: "zle", text: "server neodpovedal: " + e }; vykresli(); });
  });
  document.getElementById("autor").addEventListener("input", e => {
    AUTOR.meno = e.target.value;
    try { localStorage.setItem("assetin-autor", AUTOR.meno.trim()); } catch (err) { /* súkromné okno */ }
    e.target.classList.toggle("chyba", API.autorPovinny && !AUTOR.meno.trim() && ZMENY.length > 0);
  });
  window.addEventListener("hashchange", pouzitAdresu);
  pouzitAdresu();
  zistiApi();
})();
</script>
