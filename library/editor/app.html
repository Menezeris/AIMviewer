  /** Zoznam objektov = editovateľná vnorená tabuľka: stĺpce sú skalárne polia položky zo schémy,
      riadok sa dá rozbaliť na celý záznam (vnorené únie, napr. `ifc`). Únie bez spoločných stĺpcov
      ostávajú zoznamom so zhrnutím. Nič z toho nie je napísané pre konkrétny typ (zásada 3). */
  function bunkaZoznamuObjektov(ctx, popis, pointer) {
    const hodnoty = citaj(PRACOVNE[ctx.id], pointer) || [];
    const stlpce = popis.druh === "zoznam-objektov" ? (popis.polia || []).filter(stlpcovatelne) : [];
    const obal = h("div", "vnorene");
    obal.appendChild(listaZoznamu(ctx, popis, pointer, hodnoty));
    if (!hodnoty.length) return obal;
    if (!stlpce.length) {
      hodnoty.forEach((hodnota, i) => obal.appendChild(zaznamZoznamu(ctx, popis, pointer, hodnoty, hodnota, i)));
      return obal;
    }

    // stĺpec zhrnutia vznikne, len keď z neho po odrátaní stĺpcov niečo zostane
    const maZhrnutie = (popis.polia || []).some(f => !stlpcovatelne(f))
      && hodnoty.some(hodnota => zhrnutiePolozky(popis, hodnota, stlpce));
    const tabObal = h("div", "tabulka-vnorena");
    const t = h("table", "vnorena");
    const thead = document.createElement("thead");
    const hr = document.createElement("tr");
    hr.appendChild(h("th", null, ""));
    if (maZhrnutie) hr.appendChild(h("th", null, "položka"));
    stlpce.forEach(sx => hr.appendChild(h("th", null, sx.titulok)));
    hr.appendChild(h("th", null, ""));
    thead.appendChild(hr);
    t.appendChild(thead);
    const tb = document.createElement("tbody");
    hodnoty.forEach((hodnota, i) => {
      const cestaPolozky = pointer + "/" + i;
      const kluc = ctx.id + cestaPolozky;
      const otvorene = OTVORENE.has(kluc);
      const tr = h("tr", otvorene ? "otvoreny" : null);
      const tdS = h("td", "uzka");
      const sipka = h("button", "ikonka");
      sipka.type = "button";
      sipka.setAttribute("aria-expanded", String(otvorene));
      sipka.setAttribute("aria-label", otvorene ? "Zbaliť záznam" : "Rozbaliť záznam");
      sipka.appendChild(ikona("ti-chevron-right", otvorene ? "sipka otvorena" : "sipka"));
      sipka.addEventListener("click", () => prepniOtvorenie(kluc));
      tdS.appendChild(sipka);
      tr.appendChild(tdS);
      if (maZhrnutie) {
        const tdZ = h("td", "zhrnutie-bunka riadok-klik", zhrnutiePolozky(popis, hodnota, stlpce) || "—");
        tdZ.addEventListener("click", () => prepniOtvorenie(kluc));
        tr.appendChild(tdZ);
      }
      stlpce.forEach(sx => {
        const td = document.createElement("td");
        td.appendChild(hodnotaPola(ctx, sx, cestaPolozky + "/" + sx.kluc, true));
        tr.appendChild(td);
      });
      const tdO = h("td", "uzka");
      const odznaky = h("div", "odznaky");
      const vnutorne = diagPodStrom(ctx.id, cestaPolozky).filter(d => !stlpce.some(sx => d.json_pointer === cestaPolozky + "/" + sx.kluc));
      const o = odznakDiag(vnutorne);
      if (o) odznaky.appendChild(o);
      if (ZMENY.some(z => z.id === ctx.id && z.pointer.indexOf(cestaPolozky) === 0)) odznaky.appendChild(h("span", "znak", "zmenené"));
      if (!popis.odvodene) odznaky.appendChild(tlacidloZmazat(ctx, popis, pointer, hodnoty, i));
      tdO.appendChild(odznaky);
      tr.appendChild(tdO);
      tb.appendChild(tr);
      if (otvorene) {
        const tr2 = h("tr", "detail-riadok");
        const td = h("td", "detail-bunka");
        td.colSpan = stlpce.length + 2 + (maZhrnutie ? 1 : 0);
        td.appendChild(detailZaznamu(ctx, popis, hodnota, cestaPolozky));
        tr2.appendChild(td);
        tb.appendChild(tr2);
      }
    });
    t.appendChild(tb);
    tabObal.appendChild(t);
    obal.appendChild(tabObal);
    return obal;
  }

  /** Jeden záznam zoznamu ako rozbaľovací riadok (únie bez spoločných stĺpcov). */
  function zaznamZoznamu(ctx, popis, pointer, hodnoty, hodnota, i) {
    const cestaPolozky = pointer + "/" + i;
    const kluc = ctx.id + cestaPolozky;
    const otvorene = OTVORENE.has(kluc);
    const zaznam = h("div", "zaznam");
    const hlava = h("div", "hlava");
    hlava.appendChild(ikona("ti-chevron-right", otvorene ? "sipka otvorena" : "sipka"));
    hlava.appendChild(h("span", "idx", "[" + i + "]"));
    hlava.appendChild(h("span", "zhrnutie", zhrnutiePolozky(popis, hodnota)));
    const odznaky = h("div", "odznaky");
    const o = odznakDiag(diagPodStrom(ctx.id, cestaPolozky));
    if (o) odznaky.appendChild(o);
    if (ZMENY.some(z => z.id === ctx.id && z.pointer.indexOf(cestaPolozky) === 0)) odznaky.appendChild(h("span", "znak", "zmenené"));
    if (!popis.odvodene) odznaky.appendChild(tlacidloZmazat(ctx, popis, pointer, hodnoty, i));
    hlava.appendChild(odznaky);
    hlava.addEventListener("click", () => prepniOtvorenie(kluc));
    zaznam.appendChild(hlava);
    if (otvorene) zaznam.appendChild(detailZaznamu(ctx, popis, hodnota, cestaPolozky));
    return zaznam;
  }

  function bunkaMapy(ctx, popis, pointer) {
    const hodnota = citaj(PRACOVNE[ctx.id], pointer) || {};
    const obal = h("div", "vnorene");
    Object.keys(hodnota).forEach(k => {
      const zaznam = h("div", "zaznam");
      const hlava = h("div", "hlava");
      hlava.appendChild(h("span", "zhrnutie", k + " → " + textHodnoty(hodnota[k])));
      zaznam.appendChild(hlava);
      const detail = h("div", "detail");
      (popis.polia || []).forEach(p => detail.appendChild(poleRiadok(ctx, p, pointer + "/" + k + "/" + p.kluc)));
      zaznam.appendChild(detail);
      obal.appendChild(zaznam);
    });
    if (!Object.keys(hodnota).length) obal.appendChild(h("div", "lista", "prázdne"));
    return obal;
  }

  function hodnotaPola(ctx, popis, pointer, kompakt) {
    const d = popis.druh;
    if (d === "odkaz") return bunkaOdkazov(ctx, popis, pointer, true, kompakt);
    if (d === "zoznam-odkazov") return bunkaOdkazov(ctx, popis, pointer, false, kompakt);
    if (d === "zoznam-textov") return bunkaZoznamuTextov(ctx, popis, pointer);
    if (d === "objekt") return bunkaObjektu(ctx, popis, pointer);
    if (d === "zoznam-objektov" || d === "zoznam-unii") return bunkaZoznamuObjektov(ctx, popis, pointer);
    if (d === "unia-objektov") {
      const varianta = variantPolozky(popis, citaj(PRACOVNE[ctx.id], pointer));
      const box = h("div", "vnorene");
      if (popis.varianty && popis.varianty.length > 1 && !popis.odvodene) {
        const lista = h("div", "lista");
        lista.appendChild(h("span", null, "druh"));
        const sel = h("select", "vstup");
        sel.style.maxWidth = "200px";
        popis.varianty.forEach(v => {
          const o = h("option", null, v.diskriminator ? v.diskriminator.hodnota : v.povinne_kluce.join(" + "));
          o.value = v.nazov;
          if (varianta && v.nazov === varianta.nazov) o.selected = true;
          sel.appendChild(o);
        });
        sel.addEventListener("change", () => {
          const novy = popis.varianty.find(v => v.nazov === sel.value);
          nastav(ctx.id, pointer, kostraVariantu(novy), popis);
        });
        lista.appendChild(sel);
        box.appendChild(lista);
      }
      const detail = h("div", "detail");
      (varianta ? varianta.polia : []).forEach(f => detail.appendChild(poleRiadok(ctx, f, pointer + "/" + f.kluc)));
      box.appendChild(detail);
      return box;
    }
    if (d === "mapa-objektov" || d === "mapa") return bunkaMapy(ctx, popis, pointer);
    return bunkaSkalara(ctx, popis, pointer, kompakt);
  }

  //: druhy, ktoré potrebujú celú šírku riadka (vnorená tabuľka, vnorený objekt, dlhý text, zoznamy)
  const SIROKE = new Set(["zoznam-objektov", "zoznam-unii", "unia-objektov", "objekt", "dlhy-text"]);
  //: zoznam odkazov ide cez celý riadok, len keď je v ňom viac než pár čipov
  const VELA_ODKAZOV = 3;
  function poleRiadok(ctx, popis, pointer) {
    const hodnota = citaj(PRACOVNE[ctx.id], pointer);
    const siroke = SIROKE.has(popis.druh)
      || ((popis.druh === "zoznam-odkazov" || popis.druh === "zoznam-textov")
          && Array.isArray(hodnota) && hodnota.length > VELA_ODKAZOV);
    const riadok = h("div", "pole" + (siroke ? " siroke" : ""));
    riadok.appendChild(menovka(popis));
    const hod = h("div", "hodnota");
    hod.appendChild(hodnotaPola(ctx, popis, pointer, false));
    // [Q44] návod stojí pod hodnotou len tam, kde autor ešte nevie, čo vyplniť: prázdne pole
    // alebo pole s nálezom. Pri vyplnenom poli je celý text v `title` menovky.
    if (popis.popis && (prazdne(hodnota) || diagPodStrom(ctx.id, pointer).length)) {
      hod.appendChild(h("div", "pod-hodnotou", popis.popis));
    }
    riadok.appendChild(hod);
    return riadok;
  }

  // ────────────────────────────────────── výber wikilinku s kotvou (dialóg)
  function otvorVyber(ctx, popis, pointer, jedenOdkaz, index) {
    const povolene = popis.cielove_typy || [];
    const politikaKotvy = popis.kotva || "ziadna";
    const surove = citaj(PRACOVNE[ctx.id], pointer);
    const teraz = jedenOdkaz ? surove : (surove || [])[index];
    const m = teraz ? String(teraz).match(/^\[\[([^\[\]#|]+)(?:#([^\[\]|]+))?/) : null;
    let ciel = m ? m[1] : null;
    let kotva = m && m[2] ? m[2] : null;

    const kandidati = Object.keys(UZLY).map(id => UZLY[id])
      .filter(u => !povolene.length || povolene.indexOf(u.typ) >= 0)
      .sort((a, b) => (a.visiaci - b.visiaci) || a.id.localeCompare(b.id, "sk"));

    const prekryv = h("div", "prekryv");
    const dialog = h("div", "dialog");
    const hlava = document.createElement("header");
    hlava.appendChild(h("h2", null, "Cieľ poľa " + popis.kluc));
    hlava.appendChild(h("p", null,
      (povolene.length ? "povolené typy: " + povolene.join(", ") : "bez obmedzenia typu") +
      " · kotva: " + politikaKotvy + " — obidvoje pochádza zo schémy, nie z tohto dialógu"));
    dialog.appendChild(hlava);

    const panely = h("div", "panely");
    const lavy = h("div", "panel");
    lavy.appendChild(h("h3", null, "Poznámka"));
    const hladanie = h("div", "hladanie");
    const vstup = h("input", "vstup");
    vstup.type = "search";
    vstup.placeholder = "hľadať podľa ID alebo názvu…";
    hladanie.appendChild(vstup);
    lavy.appendChild(hladanie);
    const zoznamCielov = h("div", "zoznam");
    lavy.appendChild(zoznamCielov);

    const pravy = h("div", "panel");
    pravy.appendChild(h("h3", null, "Kotva" + (politikaKotvy === "povinna" ? " (povinná)" : politikaKotvy === "volitelna" ? " (voliteľná)" : " — pole ju nepoužíva")));
    const zoznamKotiev = h("div", "zoznam");
    pravy.appendChild(zoznamKotiev);
    panely.appendChild(lavy);
    panely.appendChild(pravy);
    dialog.appendChild(panely);

    const noha = document.createElement("footer");
    const nahlad = h("span", "nahlad");
    noha.appendChild(nahlad);
    const zrus = h("button", "mini");
    zrus.type = "button";
    zrus.textContent = "zrušiť";
    const potvrd = h("button", "hlavne");
    potvrd.type = "button";
    potvrd.textContent = "vložiť odkaz";
    noha.appendChild(zrus);
    noha.appendChild(potvrd);
    dialog.appendChild(noha);
    prekryv.appendChild(dialog);
    document.getElementById("app").appendChild(prekryv);

    const zavri = () => { prekryv.parentNode.removeChild(prekryv); document.removeEventListener("keydown", naKlaves); };
    const naKlaves = e => { if (e.key === "Escape") zavri(); };
    document.addEventListener("keydown", naKlaves);
    zrus.addEventListener("click", zavri);
    prekryv.addEventListener("click", e => { if (e.target === prekryv) zavri(); });

    const odkazText = () => (ciel ? "[[" + ciel + (kotva ? "#" + kotva : "") + "]]" : "");
    function prekresli() {
      const filter = vstup.value.trim().toLowerCase();
      zoznamCielov.innerHTML = "";
      kandidati.filter(u => !filter || u.id.toLowerCase().indexOf(filter) >= 0 || String(u.nazov).toLowerCase().indexOf(filter) >= 0)
        .forEach(u => {
          const b = h("button", "volba");
          b.type = "button";
          if (u.id === ciel) b.setAttribute("aria-selected", "true");
          b.appendChild(h("span", null, u.id));
          b.appendChild(h("span", "meta", u.visiaci ? "nenapísaná" : (u.typ + " · " + skrat(u.nazov, 26))));
          b.addEventListener("click", () => { ciel = u.id; kotva = null; prekresli(); });
          zoznamCielov.appendChild(b);
        });
      if (!zoznamCielov.childNodes.length) zoznamCielov.appendChild(h("div", "prazdno", "nič nesedí"));

      zoznamKotiev.innerHTML = "";
      if (politikaKotvy === "ziadna") {
        zoznamKotiev.appendChild(h("div", "prazdno", "pole `" + popis.kluc + "` mieri na celú poznámku"));
      } else {
        const kotvy = (ciel && DATA.kotvy[ciel]) || {};
        const kluce = Object.keys(kotvy).filter(k => kotvy[k] !== "nadpis" || k === k.toLowerCase());
        if (politikaKotvy === "volitelna") {
          const b = h("button", "volba");
          b.type = "button";
          if (!kotva) b.setAttribute("aria-selected", "true");
          b.appendChild(h("span", null, "(bez kotvy)"));
          b.addEventListener("click", () => { kotva = null; prekresli(); });
          zoznamKotiev.appendChild(b);
        }
        Object.keys(kotvy).sort().forEach(k => {
          if (kotvy[k] === "nadpis" && kluce.indexOf(k) < 0) return;
          const b = h("button", "volba");
          b.type = "button";
          if (k === kotva) b.setAttribute("aria-selected", "true");
          b.appendChild(h("span", null, "#" + k));
          b.appendChild(h("span", "meta", kotvy[k] === "uloha" ? "úloha" : kotvy[k] === "pod" ? "pod-záznam" : "nadpis"));
          b.addEventListener("click", () => { kotva = k; prekresli(); });
          zoznamKotiev.appendChild(b);
        });
        if (!Object.keys(kotvy).length) {
          zoznamKotiev.appendChild(h("div", "prazdno", ciel ? "cieľ nemá kotvy — napíš ju ručne nižšie" : "najprv vyber poznámku"));
          const rucne = h("div", "hladanie");
          const rv = h("input", "vstup mono");
          rv.placeholder = "napr. CCI-priestory";
          rv.value = kotva || "";
          rv.addEventListener("input", () => { kotva = rv.value || null; nahlad.textContent = odkazText(); });
          rucne.appendChild(rv);
          zoznamKotiev.appendChild(rucne);
        }
      }
      nahlad.textContent = odkazText();
      potvrd.disabled = !ciel || (politikaKotvy === "povinna" && !kotva);
    }
    vstup.addEventListener("input", prekresli);
    potvrd.addEventListener("click", () => {
      const text = odkazText();
      if (jedenOdkaz) nastav(ctx.id, pointer, text, popis);
      else {
        const zoznam = (citaj(PRACOVNE[ctx.id], pointer) || []).slice();
        zoznam[index] = text;
        nastav(ctx.id, pointer, zoznam, popis);
      }
      zavri();
    });
    prekresli();
    vstup.focus();
  }

  // ══════════════════════════════════════════ pohľad: register (tabuľka typu)
  /** Pole podľa bodkovej cesty („objekt.ifc_entita") — stĺpec smie siahnuť do vnoreného objektu. */
  function poleCestou(popisTypu, cesta) {
    const casti = String(cesta).split(".");
    let zoznam = (popisTypu && popisTypu.polia) || [];
    let najdene = null;
    let pointer = "";
    for (const c of casti) {
      najdene = zoznam.find(f => f.kluc === c);
      if (!najdene) return null;
      pointer += "/" + najdene.kluc;
      zoznam = najdene.polia || [];
    }
    return Object.assign({}, najdene, { pointer, cesta: String(cesta) });
  }

  const stlpcovatelne = f =>
    SKALARNE.has(f.druh) || f.druh === "odkaz" || f.druh === "zoznam-odkazov" || f.druh === "zoznam-textov";

  /** Predvolená zostava stĺpcov je na definícii typu v schéme (STLPCE), nie v tomto kóde. */
  function stlpceRegistra(popisTypu, typ) {
    const predvolene = (popisTypu.stlpce || [])
      .map(c => poleCestou(popisTypu, c))
      .filter(f => f && stlpcovatelne(f));
    if (!STAV.stlpceNavyse[typ]) return predvolene;
    const uz = new Set(predvolene.map(f => f.cesta));
    const zvysok = (popisTypu.polia || [])
      .filter(f => !SKRYTE_V_REGISTRI.has(f.kluc) && stlpcovatelne(f) && !uz.has(f.kluc))
      .map(f => Object.assign({}, f, { pointer: "/" + f.kluc, cesta: f.kluc }));
    return predvolene.concat(zvysok);
  }

  function prepinacStlpcov(typ, popisTypu, kolko) {
    const b = h("button", "mini");
    b.type = "button";
    const vsetky = !!STAV.stlpceNavyse[typ];
    const skryte = (popisTypu.polia || []).filter(f => !SKRYTE_V_REGISTRI.has(f.kluc) && stlpcovatelne(f)).length - kolko;
    b.textContent = vsetky ? "len predvolené stĺpce" : "+ " + mnozne(Math.max(skryte, 0), "ďalší stĺpec", "ďalšie stĺpce", "ďalších stĺpcov");
    b.addEventListener("click", () => { STAV.stlpceNavyse[typ] = !vsetky; vykresli(); });
    return b;
  }

  function panelHromadnej(ids, stlpce) {  // eslint-disable-line no-unused-vars
    const upravitelne = stlpce.filter(s => (s.druh === "enum" || s.druh === "boolean") && !s.odvodene);
    if (!VYBRANE.size || !upravitelne.length) return null;
    const box = h("div", "hromadne");
    box.appendChild(h("span", null, mnozne(VYBRANE.size, "vybraná poznámka", "vybrané poznámky", "vybraných poznámok")));
    box.appendChild(h("span", "muted", "· nastaviť"));
    const pole = h("select", "vstup");
    upravitelne.forEach(s => {
      const o = h("option", null, s.titulok);
      o.value = s.kluc;
      pole.appendChild(o);
    });
    box.appendChild(pole);
    box.appendChild(h("span", "muted", "na"));
    const hodnota = h("select", "vstup");
    const naplnHodnoty = () => {
      const s = upravitelne.find(x => x.kluc === pole.value);
      hodnota.innerHTML = "";
      const moznosti = s.druh === "boolean" ? ["true", "false"] : (s.hodnoty || []).map(String);
      [""].concat(moznosti).forEach(v => {
        const o = h("option", null, v || "—");
        o.value = v;
        hodnota.appendChild(o);
      });
    };
    naplnHodnoty();
    pole.addEventListener("change", naplnHodnoty);
    box.appendChild(hodnota);
    const pouzi = h("button", "mini");
    pouzi.type = "button";
    pouzi.textContent = "použiť";
    pouzi.addEventListener("click", () => {
      const s = upravitelne.find(x => x.kluc === pole.value);
      let v = hodnota.value;
      if (v === "") v = null;
      else if (s.druh === "boolean") v = v === "true";
      // jedno prekreslenie na konci: nastav() ho volá samo, preto zapisujeme priamo a zmeny zbierame
      Array.from(VYBRANE).forEach(id => {
        const pointer = s.pointer || ("/" + s.kluc);
        const povodne = citaj(POZNAMKY[id].data, pointer);
        zapis(PRACOVNE[id], pointer, v);
        const i = ZMENY.findIndex(z => z.id === id && z.pointer === pointer);
        const rovnake = JSON.stringify(povodne === undefined ? null : povodne) === JSON.stringify(v);
        if (rovnake) { if (i >= 0) ZMENY.splice(i, 1); }
        else {
          const z = { id, pointer, titulok: s.titulok, predtym: povodne, teraz: v };
          if (i >= 0) ZMENY[i] = z; else ZMENY.push(z);
        }
      });
      vykresli();
    });
    box.appendChild(pouzi);
    const zrus = h("button", "mini");
    zrus.type = "button";
    zrus.textContent = "zrušiť výber";
    zrus.addEventListener("click", () => { VYBRANE.clear(); vykresli(); });
    box.appendChild(zrus);
    return box;
  }

  function tabulkaRegistra(plocha, typ) {
    const popisTypu = TYPY[typ];
    const ids = poznamkyTypu(typ);
    const stlpce = stlpceRegistra(popisTypu, typ);

    const panel = panelHromadnej(ids, stlpce);
    if (panel) plocha.appendChild(panel);

    const obal = h("div", "tabulka-obal");
    const t = h("table", "mriezka");
    const thead = document.createElement("thead");
    const hr = document.createElement("tr");
    const thVyber = h("th", null);
    const vsetky = h("input", null);
    vsetky.type = "checkbox";
    vsetky.checked = ids.length > 0 && ids.every(id => VYBRANE.has(id));
    vsetky.title = "Vybrať všetky";
    vsetky.addEventListener("change", () => {
      if (vsetky.checked) ids.forEach(id => VYBRANE.add(id)); else VYBRANE.clear();
      vykresli();
    });
    thVyber.appendChild(vsetky);
    thVyber.className = "lepiaci";
    hr.appendChild(thVyber);
    hr.appendChild(h("th", "mono lepiaci", "id"));
    stlpce.forEach(s => hr.appendChild(h("th", null, s.titulok)));
    hr.appendChild(h("th", null, "nálezy"));
    thead.appendChild(hr);
    t.appendChild(thead);

    const tb = document.createElement("tbody");
    ids.forEach(id => {
      const tr = h("tr", VYBRANE.has(id) ? "vybrany" : null);
      const tdVyber = h("td", "lepiaci");
      const ch = h("input", null);
      ch.type = "checkbox";
      ch.checked = VYBRANE.has(id);
      ch.addEventListener("change", () => { if (ch.checked) VYBRANE.add(id); else VYBRANE.delete(id); vykresli(); });
      tdVyber.appendChild(ch);
      tr.appendChild(tdVyber);

      // klik na riadok (bunku ID) otvorí stránku poznámky; klik na inú bunku edituje (kolo 3 §1)
      const tdId = h("td", "mono lepiaci riadok-klik");
      const odkaz = h("button", "cip");
      odkaz.type = "button";
      odkaz.appendChild(h("span", "cip-id", id));
      odkaz.title = "Otvoriť " + id;
      odkaz.addEventListener("click", e => { e.stopPropagation(); otvorPoznamku(id); });
      tdId.appendChild(odkaz);
      tdId.addEventListener("click", () => otvorPoznamku(id));
      tr.appendChild(tdId);

      const ctx = { id };
      stlpce.forEach(s => {
        const td = document.createElement("td");
        td.appendChild(hodnotaPola(ctx, s, s.pointer, true));
        tr.appendChild(td);
      });
      const diagy = DIAG_PODLA[id] || [];
      const td = document.createElement("td");
      const o = odznakDiag(diagy);
      if (o) td.appendChild(o); else td.appendChild(h("span", "muted", "—"));
      tr.appendChild(td);
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    obal.appendChild(t);
    if (!ids.length) obal.appendChild(h("div", "prazdno", "V knižnici zatiaľ nie je ani jedna poznámka tohto typu."));
    plocha.appendChild(obal);
  }

  /** Ploché položky celého registra — tam, kde má hromadná zmena `povinnost` zmysel. */
  /** [U13] Tabuľka pod-záznamov: riadok = pravidlo (profil, slovník), zoskupenie = poznámka, ktorá
      ho nesie. Stĺpce sú zo schémy druhu (`STLPCE` na `PravidloSTD`…), bunky sa editujú cez ten istý
      pointer `/__pod/<id>/<pole>`, ktorý pozná writer. */
  function tabulkaPodZaznamov(plocha, typ, druh) {
    const popisDruhu = TYPY["pod-" + druh] || { polia: [], stlpce: [] };
    const stlpce = stlpceRegistra(popisDruhu, "pod-" + druh);
    const riadky = podZaznamyTypu(typ, druh);

    const obal = h("div", "tabulka-obal");
    const tab = h("table", "mriezka");
    const thead = document.createElement("thead");
    const hr = document.createElement("tr");
    hr.appendChild(h("th", "mono lepiaci", "id"));
    stlpce.forEach(s => hr.appendChild(h("th", null, s.titulok)));
    hr.appendChild(h("th", null, "nálezy"));
    thead.appendChild(hr);
    tab.appendChild(thead);

    const tb = document.createElement("tbody");
    let posledna = null;
    riadky.forEach(r => {
      if (r.poznamka !== posledna) {
        posledna = r.poznamka;
        const tr = h("tr", "skupinovy");
        const td = h("td", null);
        td.colSpan = stlpce.length + 2;
        const b = h("button", "cip");
        b.type = "button";
        b.appendChild(h("span", "cip-id", r.poznamka));
        b.title = "Otvoriť poznámku " + r.poznamka;
        b.addEventListener("click", () => otvorPoznamku(r.poznamka));
        td.appendChild(b);
        td.appendChild(h("span", "muted", (POZNAMKY[r.poznamka].nazov || "") + " · " +
          mnozne(podZaznamyTypu(typ, druh).filter(x => x.poznamka === r.poznamka).length, "záznam", "záznamy", "záznamov")));
        tr.appendChild(td);
        tb.appendChild(tr);
      }
      const tr = document.createElement("tr");
      const tdId = h("td", "mono lepiaci riadok-klik");
      const odkaz = h("button", "cip");
      odkaz.type = "button";
      odkaz.appendChild(h("span", "cip-id", r.pz.id));
      odkaz.title = "Otvoriť " + r.pz.id;
      odkaz.addEventListener("click", e => { e.stopPropagation(); otvorPod(r.poznamka, r.pz.id); });
      tdId.appendChild(odkaz);
      tdId.addEventListener("click", () => otvorPod(r.poznamka, r.pz.id));
      tr.appendChild(tdId);

      const ctx = { id: r.poznamka, pod: r.pz.id };
      stlpce.forEach(s => {
        const td = document.createElement("td");
        td.appendChild(hodnotaPola(ctx, s, "/__pod/" + r.pz.id + "/" + s.kluc, true));
        tr.appendChild(td);
      });
      const diagy = (DIAG_PODLA[r.poznamka] || []).filter(d => (d.json_pointer || "").indexOf("#" + r.pz.id) === 0);
      const td = document.createElement("td");
      const o = odznakDiag(diagy);
      if (o) td.appendChild(o); else td.appendChild(h("span", "muted", "—"));
      tr.appendChild(td);
      tb.appendChild(tr);
    });
    tab.appendChild(tb);
    obal.appendChild(tab);
    if (!riadky.length) obal.appendChild(h("div", "prazdno", "Ani jedna poznámka tohto typu zatiaľ taký záznam nenesie."));
    plocha.appendChild(obal);
  }

  function tabulkaPoloziek(plocha, typ, polePolozek) {
    const ids = poznamkyTypu(typ);
    const riadky = [];
    ids.forEach(id => {
      (citaj(PRACOVNE[id], "/" + polePolozek.kluc) || []).forEach((pol, i) => {
        riadky.push({ id, i, pol, pointer: "/" + polePolozek.kluc + "/" + i });
      });
    });

    const stlpce = (polePolozek.polia || []).filter(p =>
      (SKALARNE.has(p.druh) || p.druh === "odkaz") && !p.odvodene &&
      ["povinnost", "zavaznost", "overenie", "rola", "vzor", "povaha", "pravidlo", "definicia_ref", "hodnoty_ref"].indexOf(p.kluc) >= 0
    );

    if (VYBRANE.size) {
      const box = h("div", "hromadne");
      box.appendChild(h("span", null, mnozne(VYBRANE.size, "vybraná položka", "vybrané položky", "vybraných položiek") + " · nastaviť"));
      const pole = h("select", "vstup");
      stlpce.filter(s => s.druh === "enum").forEach(s => {
        const o = h("option", null, s.titulok);
        o.value = s.kluc;
        pole.appendChild(o);
      });
      box.appendChild(pole);
      box.appendChild(h("span", "muted", "na"));
      const hodnota = h("select", "vstup");
      const napln = () => {
        const s = stlpce.find(x => x.kluc === pole.value);
        hodnota.innerHTML = "";
        [""].concat((s.hodnoty || []).map(String)).forEach(v => {
          const o = h("option", null, v || "—");
          o.value = v;
          hodnota.appendChild(o);
        });
      };
      napln();
      pole.addEventListener("change", napln);
      box.appendChild(hodnota);
      const pouzi = h("button", "mini");
      pouzi.type = "button";
      pouzi.textContent = "použiť";
      pouzi.addEventListener("click", () => {
        const s = stlpce.find(x => x.kluc === pole.value);
        const v = hodnota.value === "" ? null : hodnota.value;
        Array.from(VYBRANE).forEach(kluc => {
          const [id, pointer] = kluc.split("|");
          const cielovy = pointer + "/" + s.kluc;
          const povodne = citaj(POZNAMKY[id].data, cielovy);
          zapis(PRACOVNE[id], cielovy, v);
          const i = ZMENY.findIndex(z => z.id === id && z.pointer === cielovy);
          if (JSON.stringify(povodne === undefined ? null : povodne) === JSON.stringify(v)) { if (i >= 0) ZMENY.splice(i, 1); }
          else {
            const z = { id, pointer: cielovy, titulok: s.titulok, predtym: povodne, teraz: v };
            if (i >= 0) ZMENY[i] = z; else ZMENY.push(z);
          }
        });
        vykresli();
      });
      box.appendChild(pouzi);
      const zrusB = h("button", "mini");
      zrusB.type = "button";
      zrusB.textContent = "zrušiť výber";
      zrusB.addEventListener("click", () => { VYBRANE.clear(); vykresli(); });
      box.appendChild(zrusB);
      plocha.appendChild(box);
    }

    const obal = h("div", "tabulka-obal");
    const t = h("table", "mriezka");
    const thead = document.createElement("thead");
    const hr = document.createElement("tr");
    hr.appendChild(h("th", null, ""));
    hr.appendChild(h("th", null, "poznámka"));
    hr.appendChild(h("th", null, "položka"));
    stlpce.forEach(s => hr.appendChild(h("th", null, s.titulok)));
    hr.appendChild(h("th", null, "odkiaľ"));
    thead.appendChild(hr);
    t.appendChild(thead);
    const tb = document.createElement("tbody");
    riadky.forEach(r => {
      const klucVyberu = r.id + "|" + r.pointer;
      const tr = h("tr", VYBRANE.has(klucVyberu) ? "vybrany" : null);
      const tdV = document.createElement("td");
      const ch = h("input", null);
      ch.type = "checkbox";
      ch.checked = VYBRANE.has(klucVyberu);
      ch.addEventListener("change", () => { if (ch.checked) VYBRANE.add(klucVyberu); else VYBRANE.delete(klucVyberu); vykresli(); });
      tdV.appendChild(ch);
      tr.appendChild(tdV);

      const tdP = h("td", "mono");
      const b = h("button", "cip");
      b.type = "button";
      b.appendChild(h("span", "cip-id", r.id));
      b.addEventListener("click", () => otvorPoznamku(r.id, klucPolozky(r.pol)));
      tdP.appendChild(b);
      tr.appendChild(tdP);

      const tdK = h("td", "mono");
      tdK.appendChild(h("span", null, klucPolozky(r.pol)));
      tdK.appendChild(h("span", "ifc", ifcPopis(r.pol)));
      tr.appendChild(tdK);

      const ctx = { id: r.id };
      stlpce.forEach(s => {
        const td = document.createElement("td");
        td.appendChild(hodnotaPola(ctx, s, r.pointer + "/" + s.kluc, true));
        tr.appendChild(td);
      });
      const povod = povodPolozky(r.id, klucPolozky(r.pol), vymenyPre(r.id)[0] || null);
      tr.appendChild(bunkaOdkial(povod));
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    obal.appendChild(t);
    if (!riadky.length) obal.appendChild(h("div", "prazdno", "Žiadne položky."));
    plocha.appendChild(obal);
  }

  /** [U13] Pod-záznamy typu (pravidlá, profily, slovníky) ako ploché riadky so zoskupením podľa
      poznámky, ktorá ich nesie. Register počíta ich, nie súbory — pravidlo je to, s čím autor
      pracuje, poznámka je obal. */
  function podZaznamyTypu(typ, druh) {
    const out = [];
    poznamkyTypu(typ).forEach(id => {
      (POZNAMKY[id].pod_zaznamy || []).forEach(pz => {
        if (!druh || pz.druh === druh) out.push({ poznamka: id, pz });
      });
    });
    return out;
  }
  const druhyRegistra = typ => ((TYPY[typ] || {}).pod_zaznamy || []).filter(d => podZaznamyTypu(typ, d).length);
  const zalozkaPod = z => (typeof z === "string" && z.indexOf("pod:") === 0 ? z.slice(4) : null);

  function pohladRegistra(plocha) {
    const typ = STAV.typ;
    const popisTypu = TYPY[typ] || { polia: [], sekcie: [] };
    const polePolozek = (popisTypu.polia || []).find(p => p.polozky);
    const druhy = druhyRegistra(typ);
    // register s pod-záznamami sa otvára na nich (U13); „Poznámky" ostávajú ako ďalšia záložka
    if (druhy.length && STAV.zalozka === "poznamky" && !STAV.zalozkaVolena) STAV.zalozka = "pod:" + druhy[0];
    // záložka z iného registra sem nepatrí (STD → UC)
    if (zalozkaPod(STAV.zalozka) && druhy.indexOf(zalozkaPod(STAV.zalozka)) < 0) STAV.zalozka = "poznamky";
    const druh = zalozkaPod(STAV.zalozka);
    const pocet = druh
      ? mnozne(podZaznamyTypu(typ, druh).length, "záznam", "záznamy", "záznamov") + " · " + popisokTypu("pod-" + druh) +
        " · v " + mnozne(new Set(podZaznamyTypu(typ, druh).map(r => r.poznamka)).size, "poznámke", "poznámkach", "poznámkach")
      : mnozne(poznamkyTypu(typ).length, "poznámka", "poznámky", "poznámok");

    plocha.appendChild(cesta([{ text: "zadanie/" }, { text: typ }]));
    const hlavicka = h("div", "hlavicka");
    hlavicka.appendChild(h("h1", null, popisokTypu(typ)));
    hlavicka.appendChild(h("span", "technicky", typ + " · " + pocet + " · v zmluve „" + (popisTypu.popisok_export || popisokTypu(typ)) + "“"));
    if (API.zivy && API.nova) {
      // len pod serverom: ako súbor stránka nič nevytvára
      const vpravo = h("div", "vpravo");
      const nova = h("button", "mini");
      nova.type = "button";
      nova.textContent = "+ nová poznámka";
      nova.addEventListener("click", () => otvorNovuPoznamku(typ));
      vpravo.appendChild(nova);
      hlavicka.appendChild(vpravo);
    }
    plocha.appendChild(hlavicka);

    const volby = druhy.map(d => ["pod:" + d, popisokTypu("pod-" + d)]).concat([["poznamky", "Poznámky"]]);
    if (polePolozek) volby.push(["polozky", polePolozek.titulok]);
    if (volby.length > 1) {
      const zalozky = h("div", "zalozky");
      volby.forEach(z => {
        const b = h("button", "zalozka");
        b.type = "button";
        b.textContent = z[1];
        b.setAttribute("aria-selected", String(STAV.zalozka === z[0]));
        b.addEventListener("click", () => { STAV.zalozka = z[0]; STAV.zalozkaVolena = true; VYBRANE.clear(); vykresli(); });
        zalozky.appendChild(b);
      });
      plocha.appendChild(zalozky);
    }

    if (druh) tabulkaPodZaznamov(plocha, typ, druh);
    else if (polePolozek && STAV.zalozka === "polozky") tabulkaPoloziek(plocha, typ, polePolozek);
    else tabulkaRegistra(plocha, typ);

    plocha.appendChild(h("p", "poznamka-pod",
      "Stĺpce, editory buniek aj cieľové typy odkazov sú odvodené zo schémy (" + (popisTypu.polia || []).length +
      " polí typu) — v stránke nie je napísaný ani jeden formulár. " +
      (API.zivy ? "Uložiť " + ulozDoKam() + " zapíše zmeny naraz; poznámka, ktorá by sa nedala natypovať, sa neuloží."
                : "Toto je náhľad bez servera: zmeny sa nikam neukladajú.")));
  }

  // ══════════════════════════════════ pohľad: poznámka (formulár) a reťazec (kaskáda)

  /** Hodnota poľa, ktoré schéma označila ako technický identifikátor typu (IU-O: IFC entita). */
  function technickyUdaj(id, popisTypu) {
    const polia = (popisTypu && popisTypu.polia) || [];
    for (const f of polia) {
      if (f.technicky) return textHodnoty(citaj(PRACOVNE[id], "/" + f.kluc));
      if (f.druh === "objekt") {
        for (const g of (f.polia || [])) {
          if (g.technicky) return textHodnoty(citaj(PRACOVNE[id], "/" + f.kluc + "/" + g.kluc));
        }
      }
    }
    return null;
  }

  function povodPolozky(id, kluc, erId) {
    const zdroj = erId && DATA.inspektor_er[erId + "|" + id]
      ? DATA.inspektor_er[erId + "|" + id]
      : (POZNAMKY[id] || {}).inspektor;
    if (!zdroj) return null;
    return (zdroj.polozky || []).find(p => p.polozka === kluc) || null;
  }

  function bunkaOdkial(povod) {
    const td = document.createElement("td");
    if (!povod) { td.appendChild(h("span", "odkial", "—")); return td; }
    const s = povod.suhrn;
    if (s.zdroj) {
      const b = h("button", s.druh === "prepis" ? "pill" : "odkial-odkaz");
      b.type = "button";
      b.textContent = s.druh + " " + s.zdroj + (s.kotva ? "#" + s.kotva : "");
      b.title = s.popis;
      b.addEventListener("click", () => {
        if (POZNAMKY[s.zdroj]) otvorPoznamku(s.zdroj);
        else if (UZLY[s.zdroj] && UZLY[s.zdroj].rodic) otvorPod(UZLY[s.zdroj].rodic, s.zdroj);
      });
      td.appendChild(b);
    } else {
      td.appendChild(h("span", "odkial", s.popis));
    }
    return td;
  }

  /** Tabuľka Položka · Povinnosť · Odkiaľ — celý zmysel pásma „Čo a ako podrobne?". */
  function tabulkaPoloziekPasma(id, polePolozek, erId) {
    const hodnoty = citaj(PRACOVNE[id], "/" + polePolozek.kluc) || [];
    if (!hodnoty.length) return h("div", "prazdno", "Jednotka nemá ani jednu položku.");
    const t = h("table", "polozky");
    const cg = document.createElement("colgroup");
    ["c-polozka", "c-povinnost", "c-odkial"].forEach(c => {
      const col = document.createElement("col");
      col.className = c;
      cg.appendChild(col);
    });
    t.appendChild(cg);
    const thead = document.createElement("thead");
    const hr = document.createElement("tr");
    ["Položka", "Povinnosť", "Odkiaľ"].forEach(x => hr.appendChild(h("th", null, x)));
    thead.appendChild(hr);
    t.appendChild(thead);
    const tb = document.createElement("tbody");
    const ctx = { id };
    const popisPovinnost = (polePolozek.polia || []).find(p => p.kluc === "povinnost");
    hodnoty.forEach((pol, i) => {
      const kluc = klucPolozky(pol);
      const povod = povodPolozky(id, kluc, erId);
      const tr = h("tr", povod && povod.suhrn.druh === "prepis" ? "prepisana" : null);
      if (STAV.polozka === kluc && STAV.poznamka === id) tr.classList.add("vybrany");
      const tdK = h("td", "riadok-klik");
      tdK.appendChild(h("span", "kluc-polozky", kluc));
      tdK.appendChild(h("span", "ifc", ifcPopis(pol)));
      tdK.addEventListener("click", () => {
        STAV.polozka = STAV.polozka === kluc ? null : kluc;
        vykresli();
      });
      tr.appendChild(tdK);
      const tdP = document.createElement("td");
      const prepis = povod && povod.povod && popisPovinnost && povod.povod[popisPovinnost.kluc];
      if (prepis && prepis.druh === "prepis") {
        // prepísaná hodnota platí v kontexte výmeny a edituje sa v ER, nie tu: pôvodná preškrtnutá, nová vedľa
        if (prepis.povodna_hodnota != null) tdP.appendChild(h("s", "prepis-povodna", String(prepis.povodna_hodnota)));
        tdP.appendChild(h("span", "prepis-nova", String(povod.hodnota[popisPovinnost.kluc])));
      } else if (popisPovinnost) {
        tdP.appendChild(hodnotaPola(ctx, popisPovinnost, "/" + polePolozek.kluc + "/" + i + "/" + popisPovinnost.kluc, true));
      }
      tr.appendChild(tdP);
      tr.appendChild(bunkaOdkial(povod));
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    return t;
  }

  /** Polia poznámky zoskupené podľa nositeľa a sekcie — generické zo schémy. */
  function skupinyPoli(id, ciel) {
    const p = POZNAMKY[id];
    if (!p) return;
    const popisTypu = TYPY[p.typ];
    const ctx = { id };
    const polia = (popisTypu ? popisTypu.polia : []);
    const vyplnene = f => !prazdne(citaj(PRACOVNE[id], "/" + f.kluc));
    const frontmatter = polia.filter(f => f.zdroj === "frontmatter" && !f.odvodene);
    const odvodene = polia.filter(f => f.odvodene);
    const telo = polia.filter(f => f.zdroj !== "frontmatter" && !f.odvodene);

    // prázdne voliteľné polia sa zbalia — inak stránka nemá koniec (§6). Pole, na ktoré padá
    // diagnostika, sa neskrýva nikdy: čerstvá ER inak vyzerá hotovo, hoci bez `uc::`,
    // `spustacia_udalost::` a `obsahuje::` je neplatná (REVIEW §1.5).
    let skrytych = 0;
    const zobraz = zoznam => zoznam.filter(f => {
      if (STAV.vsetkyPolia || f.povinne || vyplnene(f)) return true;
      if (diagPodStrom(id, "/" + f.kluc).length) return true;
      skrytych += 1;
      return false;
    });

    const skupina = (nadpis, zdroj, zoznam) => {
      const viditelne = zobraz(zoznam);
      if (!viditelne.length) return;
      const sk = h("div", "skupina");
      const hl = h("h3", null, nadpis);
      hl.appendChild(h("span", "zdroj", mnozne(viditelne.length, "pole", "polia", "polí")));
      if (zdroj) hl.title = zdroj;                 // nositeľ poľa je technika, nie nadpis
      sk.appendChild(hl);
      const polia = h("div", "polia");
      viditelne.forEach(f => polia.appendChild(poleRiadok(ctx, f, "/" + f.kluc)));
      sk.appendChild(polia);
      ciel.appendChild(sk);
    };
    skupina("Hlavička", "frontmatter", frontmatter);
    (popisTypu ? popisTypu.sekcie : []).forEach(sekcia => {
      const vSekcii = telo.filter(f => f.sekcia === sekcia);
      if (vSekcii.length) {
        const zdroje = vSekcii.map(f => f.zdroj).filter((v, i, a) => a.indexOf(v) === i).join(" + ");
        skupina(sekcia, "sekcia tela `## " + sekcia + "` · " + zdroje, vSekcii);
      }
    });
    const bezSekcie = telo.filter(f => !f.sekcia || !((popisTypu && popisTypu.sekcie) || []).includes(f.sekcia));
    skupina("Ostatné polia tela", "inline", bezSekcie);
    skupina("Odvodené", "needituje sa — počíta ich engine (x-assetin.odvodene)", odvodene);

    if (skrytych || STAV.vsetkyPolia) {
      const b = h("button", "zbalene");
      b.type = "button";
      b.textContent = STAV.vsetkyPolia
        ? "skryť nevyplnené polia"
        : "zobraziť " + mnozne(skrytych, "ďalšie nevyplnené pole", "ďalšie nevyplnené polia", "ďalších nevyplnených polí");
      b.addEventListener("click", () => { STAV.vsetkyPolia = !STAV.vsetkyPolia; vykresli(); });
      ciel.appendChild(b);
    }
  }

  // ── pruh „kde to sedí" ────────────────────────────────────────────────────
  function retazcePre(id) { return (POZNAMKY[id] || {}).retazce || []; }
  function aktualnyRetazec(id) {
    const zoznam = retazcePre(id);
    if (!zoznam.length) return null;
    return zoznam[Math.min(STAV.retazec, zoznam.length - 1)];
  }

  /** Pruh „kde to sedí": `GOAL-A-01 › UC-0101 › T3 › ER-0101 › táto poznámka` — jeden riadok,
      segmenty sú odkazy, visiaci segment kurzívou s prerušovaným okrajom, na konci ikona
      otvorí záložku Reťazec; viac ciest ⇒ prvá a „+1 ďalšia" ako prepínač (kolo 3 §2.3). */
  function pruhKdeToSedi(id, pod) {
    const p = POZNAMKY[id] || {};
    const pz = pod ? (p.pod_zaznamy || []).find(x => x.id === pod) : null;
    const cesty = (pz ? pz.cesty : p.cesty) || [];
    const pruh = h("div", "pruh");
    if (!cesty.length) {
      pruh.appendChild(h("span", "muted", (pod ? "tento záznam" : "táto poznámka") +
        " zatiaľ nesedí na žiadnom účele užitia"));
      return pruh;
    }
    const i = Math.min(STAV.retazec, cesty.length - 1);
    cesty[i].forEach((k, j) => {
      if (j) pruh.appendChild(h("span", "oddel", "›"));
      pruh.appendChild(segmentPruhu(k));
    });
    if (cesty[i].length) pruh.appendChild(h("span", "oddel", "›"));
    pruh.appendChild(h("span", "tu", pod ? "tento záznam" : "táto poznámka"));
    const route = h("button", "ikonka pruh-retazec");
    route.type = "button";
    route.setAttribute("aria-label", pod ? "Otvoriť reťazec poznámky, ktorá záznam nesie" : "Otvoriť záložku Reťazec");
    route.appendChild(ikona("ti-route"));
    route.addEventListener("click", () => pod
      ? naviguj({ pohlad: "poznamka", poznamka: id, zalozkaPoznamky: "retazec" })
      : naviguj({ zalozkaPoznamky: "retazec" }));
    pruh.appendChild(route);
    if (cesty.length > 1) {
      const viac = h("button", "pruh-viac");
      viac.type = "button";
      viac.textContent = "+" + mnozne(cesty.length - 1, "ďalšia", "ďalšie", "ďalších") + " · " + (i + 1) + "/" + cesty.length;
      viac.title = "Poznámka sedí na viacerých kaskádach — prepnúť na ďalšiu";
      viac.addEventListener("click", () => naviguj({ retazec: (i + 1) % cesty.length }));
      pruh.appendChild(viac);
    }
    return pruh;
  }
  function segmentPruhu(k) {
    const p = POZNAMKY[k.id];
    const b = h("button", "seg" + (k.visiaci ? " visiaci" : ""));
    b.type = "button";
    // úloha sa píše ako T2, nie ako UC-0101#T2 — je to krok účelu užitia, nie iná poznámka
    b.textContent = k.rola === "uloha" ? k.kotva : k.id;
    b.title = k.visiaci
      ? k.id + " — poznámka zatiaľ neexistuje"
      : (k.rola === "uloha" ? k.id + " · úloha " + k.kotva + ": " + k.nazov : (p ? p.typ + " · " + p.nazov : k.id));
    b.addEventListener("click", () => otvorCokolvek(k.id));
    return b;
  }

  // ── pohľad poznámky: formulár, žiadne pásma ──────────────────────────────
  /** Stránka poznámky (kolo 3 §2): drobčeky · nadpis · ID + súbor · pruh · záložky · obsah. */
  function pohladPoznamky(plocha) {
    const id = STAV.poznamka;
    const p = POZNAMKY[id];
    const popisTypu = TYPY[p.typ] || { polia: [], sekcie: [] };

    plocha.appendChild(cesta([
      { text: "zadanie/" },
      { text: p.typ, akcia: () => { VYBRANE.clear(); naviguj({ pohlad: "register", typ: p.typ }); } },
      { text: id }
    ]));
    const hlavicka = h("div", "hlavicka hlavicka-poznamky");
    hlavicka.appendChild(h("h1", null, p.nazov));
    const podtitul = h("div", "podtitul", [id, technickyUdaj(id, popisTypu), p.subor].filter(Boolean).join(" · "));
    if (p.revizia && p.revizia.autor) {
      // [V29, Q64 c] kto a kedy naposledy zmenil - viac história v UI nemá
      const kedy = p.revizia.vytvorena ? new Date(p.revizia.vytvorena).toLocaleString("sk-SK") : "";
      podtitul.appendChild(h("span", "revizia", " · upravil " + p.revizia.autor + (kedy ? ", " + kedy : "") + " · rev. " + p.revizia.rev));
    }
    hlavicka.appendChild(podtitul);
    plocha.appendChild(hlavicka);
    plocha.appendChild(pruhKdeToSedi(id));

    const zalozky = h("div", "zalozky-poznamky");
    zalozky.setAttribute("role", "tablist");
    [["poznamka", "Poznámka"], ["retazec", "Reťazec"]].forEach(z => {
      const b = h("button", "zalozka-p");
      b.type = "button";
      b.setAttribute("role", "tab");
      b.textContent = z[1];
      b.setAttribute("aria-selected", String(STAV.zalozkaPoznamky === z[0]));
      b.addEventListener("click", () => naviguj({ zalozkaPoznamky: z[0] }));
      zalozky.appendChild(b);
    });
    plocha.appendChild(zalozky);

    if (STAV.zalozkaPoznamky === "retazec") zalozkaRetazec(plocha, id);
    else zalozkaPoznamka(plocha, id, p);
  }

  /** Záložka Poznámka: generický formulár zo schémy, pod-záznamy, próza tela len na čítanie. */
  function zalozkaPoznamka(plocha, id, p) {
    const detail = h("div", null);
    skupinyPoli(id, detail);
    plocha.appendChild(detail);

    if (p.pod_zaznamy.length) {
      const obal = h("div", "tabulka-obal");
      obal.style.marginTop = "12px";
      const tab = h("table", "mriezka");
      const thead = document.createElement("thead");
      const hr = document.createElement("tr");
      ["id", "druh", "názov", "riadok"].forEach(x => hr.appendChild(h("th", null, x)));
      thead.appendChild(hr);
      tab.appendChild(thead);
      const tb = document.createElement("tbody");
      p.pod_zaznamy.forEach(pz => {
        const tr = h("tr", "riadok-klik");
        tr.appendChild(h("td", "mono", pz.id));
        tr.appendChild(h("td", null, pz.druh));
        tr.appendChild(h("td", null, pz.nazov));
        tr.appendChild(h("td", "mono", String(pz.riadok)));
        tr.addEventListener("click", () => otvorPod(id, pz.id));
        tb.appendChild(tr);
      });
      tab.appendChild(tb);
      obal.appendChild(tab);
      plocha.appendChild(obal);
    }

    if (p.telo && p.telo.length) {
      const box = h("div", "proza");
      const hl = h("h3", null, "Telo poznámky");
      const pise = API.zivy && API.zapis;
      hl.appendChild(h("span", "zdroj", pise
        ? "próza · píše sa tu, odsek po odseku; nadpisy, polia a komentáre okolo ostávajú"
        : "próza · len na čítanie v náhľade"));
      box.appendChild(hl);
      p.telo.forEach(sekcia => {
        if (sekcia.nadpis) box.appendChild(h("h4", null, sekcia.nadpis));
        if (!pise || !sekcia.bloky) { box.appendChild(h("p", null, sekcia.proza)); return; }
        sekcia.bloky.forEach(b => box.appendChild(prozaBlok(id, b)));
      });
      plocha.appendChild(box);
    }
  }

  // ── pohľad reťazca: štyri pásma ako kaskáda ──────────────────────────────
  function krokCip(krok, tu) {
    const c = cip(krok.id, null, krok.id === tu && !krok.kotva, {
      kotva: krok.kotva,
      // úloha je krok účelu užitia, nie iná poznámka: pod jej číslom stojí jej vlastný popis
      stitok: krok.rola === "uloha" ? krok.kotva : null,
      nazov: krok.rola === "uloha" ? krok.nazov : null
    });
    if (krok.hranicne && krok.hranicne.length) {
      c.classList.add("hranicne");
      c.title += "\nhraničné: " + krok.hranicne.join(" + ") + " — kreslí sa raz, v spodnom pásme";
    }
    return c;
  }

  /** Prvý odsek sekcie, ktorú typ vyhlásil za odpoveď na „Prečo?" (`SEKCIA_PRECO` v schéme). */
  function precoZUcelu(r) {
    const uc = POZNAMKY[r.id];
    const sekcia = uc && ((TYPY[uc.typ] || {}).sekcia_preco);
    if (!uc || !sekcia) return null;
    const s = (uc.telo || []).find(x => x.nadpis === sekcia);
    if (!s) return null;
    const odsek = s.proza.split(/\n\s*\n/)[0].trim();
    return odsek ? { nadpis: sekcia, text: odsek } : null;
  }

  function citatUcelu(r, citat) {
    const box = h("blockquote", "citat-preco");
    box.appendChild(h("div", "text", citat.text));
    const pod = h("div", "zdroj");
    // menuj chýbajúci cieľ: „cieľ zatiaľ nie je" nepovie, ktorú poznámku treba napísať (kolo 4 §4)
    const visiace = (r.ciele || []).filter(c => c.visiaci).map(c => c.id);
    pod.appendChild(h("span", null, (visiace.length
      ? (visiace.length === 1 ? "cieľ " + visiace[0] + " v knižnici zatiaľ nie je" : "ciele " + visiace.join(", ") + " v knižnici zatiaľ nie sú")
      : "cieľ v knižnici zatiaľ nie je") + " — toto je "));
    const b = h("button", "mini");
    b.type = "button";
    b.textContent = r.id + " · " + citat.nadpis;
    b.addEventListener("click", () => naviguj({ pohlad: "poznamka", poznamka: r.id, zalozkaPoznamky: "poznamka" }));
    pod.appendChild(b);
    box.appendChild(pod);
    return box;
  }

  /** Záložka Reťazec: štyri pásma, každé kreslí svoju časť stromu účelu užitia (V23).
      Stránka nič neodsadzuje podľa roly — strom má tvar, aký prišiel: spusta nad ucel,
      ulohy a vymeny ako deti účelu, jednotky a kontajnery ako deti výmeny. */
  function zalozkaRetazec(plocha, id) {
    const zoznam = retazcePre(id);
    const r = aktualnyRetazec(id);

    if (!r) {
      plocha.appendChild(h("div", "prazdno", "Táto poznámka zatiaľ nesedí na žiadnom účele užitia — nevedie k nej žiadna cesta."));
      return;
    }
    const hlavicka = h("div", "hlavicka");
    hlavicka.appendChild(h("span", "technicky", "účel užitia " + r.id));
    if (zoznam.length > 1) {
      const vpravo = h("div", "vpravo");
      const sel = h("select", "vstup");
      sel.style.width = "auto";
      zoznam.forEach((x, i) => {
        const o = h("option", null, x.id);
        o.value = String(i);
        if (i === Math.min(STAV.retazec, zoznam.length - 1)) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener("change", () => naviguj({ retazec: Number(sel.value) }));
      vpravo.appendChild(sel);
      hlavicka.appendChild(vpravo);
    }
    plocha.appendChild(hlavicka);
    if (r.prierezovy) {
      plocha.appendChild(h("p", "poznamka-pod",
        "Poznámka je prierezová — na strome nemá vlastný uzol. Nižšie je strom účelu užitia, na ktorý dopadá; zvýraznený je uzol, ktorý na ňu odkazuje."));
    }

    const pozicie = r.pozicie || [];

    // [U19] pásmo „Čo a ako podrobne?" už nie je samostatná karta — je to rozbalenie pod predelom
    // výmeny, lebo výmena je moment v procese a nesmie byť na obrazovke dvakrát (jedna vec = jedno
    // miesto). Stránka to nevie podľa typu: pásmo jednotiek menuje engine v `r.pasma.jednotky`.
    const ramecJednotiek = PASMA.ramce.find(x => x.kluc === r.pasma.jednotky) || null;
    const pasma = h("div", "pasma");
    PASMA.ramce.forEach(ramec => {
      if (ramec.sev || ramec.kluc === r.pasma.jednotky) return;
      const box = h("div", "pasmo");
      box.style.setProperty("--farba", "var(" + ramec.farba + ")");
      box.appendChild(h("h2", null, ramec.otazka));
      const casti = [ramec.norma];
      const telo = h("div", "telo-pasma");
      let prazdne = true;

      if (ramec.kluc === r.pasma.ciele) {
        if (ramec.upresnenie) casti.push(ramec.upresnenie);
        if (r.ciele.length) {
          const rad = h("div", "kroky");
          r.ciele.forEach((k, i) => {
            if (i) rad.appendChild(h("span", "sipka-kroku", "›"));
            rad.appendChild(krokCip(k, id));
          });
          telo.appendChild(rad);
          prazdne = false;
        }
        // [PLAN §4b bod 9] cieľ chýba alebo je visiaci — „Prečo?" nesmie ostať prázdne: účel užitia
        // odpoveď nesie vo svojej próze, len ju treba ukázať (schéma hovorí, ktorá sekcia to je)
        const citat = precoZUcelu(r);
        if (citat && (!r.ciele.length || r.ciele.every(k => k.visiaci))) {
          telo.appendChild(citatUcelu(r, citat));
          prazdne = false;
        }
      }
      if (ramec.kluc === r.pasma.strom) {
        if (ramec.upresnenie) casti.push(ramec.upresnenie);
        telo.appendChild(stromKrokov(r, pozicie, id, ramecJednotiek));
        prazdne = false;
      }

      box.appendChild(h("div", "technicky", casti.filter(Boolean).join(" · ")));
      if (prazdne) {
        box.classList.add("prazdne");
        telo.textContent = "v tomto strome zatiaľ nič";
      }
      box.appendChild(telo);
      pasma.appendChild(box);
    });
    plocha.appendChild(pasma);

    const sevRamec = PASMA.ramce.find(x => x.sev);
    if (sevRamec) {
      const sev = h("div", "sev");
      sev.appendChild(h("span", "otazka", sevRamec.otazka));
      sev.appendChild(h("span", "doplnok", sevRamec.poznamka));
      plocha.appendChild(sev);
    }
  }

  /** Riadok stromu: ID (mono, pevná šírka) · názov (celý) · poznámka vpravo (11 px muted).
      Úroveň je miesto v strome, ktoré určí volajúci — nie rola uzla. */
  function riadokStromu(k, uroven, moznosti) {
    const o = moznosti || {};
    const p = POZNAMKY[k.id];
    const row = h("div", "riadok-kroku" + (o.trieda ? " " + o.trieda : "") + (k.visiaci ? " visiaci" : ""));
    row.style.paddingLeft = (16 * (uroven || 0)) + "px";
    const idB = h("button", "rk-id");
    idB.type = "button";
    idB.textContent = k.kotva ? k.kotva : k.id;
    idB.title = k.visiaci ? k.id + " — poznámka zatiaľ neexistuje (varovanie B1)"
      : (k.kotva ? k.id + " · úloha " + k.kotva + (o.titulok ? " · " + o.titulok : "")
        : (p ? p.typ + " · " + p.subor : k.id));
    idB.addEventListener("click", e => { e.stopPropagation(); if (o.klik) o.klik(); else otvorCokolvek(k.id); });
    row.appendChild(idB);
    row.appendChild(h("span", "rk-nazov", k.visiaci ? "poznámka zatiaľ neexistuje" : (k.nazov || (p ? p.nazov : ""))));
    const vpravo = o.vpravo != null ? o.vpravo : k.popis;
    if (vpravo) row.appendChild(h("span", "rk-pozn", vpravo));
    if (o.klik) row.addEventListener("click", o.klik);
    return row;
  }

  /** „Kto a kedy?": spúšťacia udalosť nad účelom a pod ním **línia** — úlohy a medzi nimi predely
      výmen (U19). Výmena je moment odovzdania (PAS 6.1.3): nad ňou úlohy, ktoré informáciu vyrábajú,
      pod ňou tie, ktoré ju používajú. Poradie určuje engine (`r.linia`), stránka ho nepočíta. */
  function stromKrokov(r, pozicie, id, ramecJednotiek) {
    const tu = kde => pozicie.some(p => p.kde === kde);
    const box = h("div", "strom");
    let kam = box;
    if (r.spusta) {
      box.appendChild(riadokStromu(r.spusta, 0, { trieda: tu("spusta") ? "tu" : "", vpravo: "spúšťa" }));
      kam = h("div", "vetva");
      box.appendChild(kam);
    }
    kam.appendChild(riadokStromu(r.ucel, 0, { trieda: tu("ucel") ? "tu" : "", vpravo: "účel užitia" }));
    const vetva = h("div", "vetva");
    (r.linia || []).forEach(usek => {
      if (usek.druh === "ulohy") {
        usek.ulohy.forEach(u => vetva.appendChild(riadokStromu(u, 0, { titulok: u.typ_popisok })));
      } else {
        vetva.appendChild(predelVymeny(usek.vymena, r, id, pozicie, ramecJednotiek));
      }
    });
    const pouzivaju = {};
    r.vymeny.forEach(v => (v.pouzivaju || []).forEach(u => { pouzivaju[u.id] = u; }));
    if (Object.keys(pouzivaju).length) vetva.appendChild(riadokPouzivaju(Object.values(pouzivaju)));
    if (vetva.childNodes.length) kam.appendChild(vetva);
    return box;
  }

  /** Predel = riadok výmeny: míľnik · ID výmeny · príjemca · počet kontajnerov · šípka.
      Klik na ID otvorí stránku (tretia úroveň hĺbky, U20), klik na riadok rozbalí obsah. */
  function predelVymeny(v, r, id, pozicie, ramecJednotiek) {
    const obal = h("div", "predel-obal");
    const ohnisko = pozicie.some(p => p.vymena === v.er.id);
    const rozbalene = jeRozbalena(v, pozicie);
    const riadok = h("button", "predel" + (ohnisko ? " tu" : ""));
    riadok.type = "button";
    riadok.setAttribute("aria-expanded", String(rozbalene));
    if (v.dodanie) riadok.appendChild(cipId(v.dodanie.id, "míľnik " + (v.dodanie.nazov || "")));
    riadok.appendChild(h("span", "oddel", "·"));
    riadok.appendChild(cipId(v.er.id, "výmena " + (v.er.nazov || "")));
    if (v.prijemca) riadok.appendChild(h("span", "p-prijemca", "→ " + v.prijemca));
    riadok.appendChild(h("span", "p-pocet", mnozne(v.kontajnery.length, "kontajner", "kontajnery", "kontajnerov")));
    riadok.appendChild(h("span", "p-sipka", rozbalene ? "▾" : "▸"));
    riadok.addEventListener("click", () => prepniVymenu(v, r, pozicie));
    obal.appendChild(riadok);
    if (rozbalene) obal.appendChild(rozbalenieVymeny(v, id, pozicie, ramecJednotiek));
    return obal;
  }

  /** ID v predele: samostatné tlačidlo, aby klik na ID otvoril stránku a nezbalil predel. */
  function cipId(nid, popis) {
    const b = h("button", "p-id");
    b.type = "button";
    b.textContent = nid;
    b.title = popis;
    b.addEventListener("click", e => { e.stopPropagation(); otvorCokolvek(nid); });
    return b;
  }

  /** Rozbalenie pod predelom = odpoveď na „Čo a ako podrobne?" tam, kde vzniká: kontajnery,
      pod nimi objekty s rozsahom aspektov (V27), a jednotka v ohnisku rozbalená do tabuľky. */
  function rozbalenieVymeny(v, tu, pozicie, ramec) {
    const box = h("div", "rozbalenie");
    if (ramec) {
      box.style.setProperty("--farba", "var(" + ramec.farba + ")");
      box.appendChild(h("h3", null, ramec.otazka));
      const jednotiek = {};
      v.kontajnery.forEach(kont => { jednotiek[kont.id] = 1; kont.objekty.forEach(o => { jednotiek[o.id] = 1; }); });
      v.jednotky.forEach(o => { jednotiek[o.id] = 1; });
      box.appendChild(h("div", "technicky", [ramec.norma, ramec.upresnenie,
        mnozne(Object.keys(jednotiek).length, "jednotka", "jednotky", "jednotiek")].filter(Boolean).join(" · ")));
    }
    // rozbalený je objekt v ohnisku iba raz — v prvom kontajneri, ktorý ho nesie (U12, V21)
    const prvyKontajner = (v.kontajnery.find(kont => kont.objekty.some(o => o.id === tu)) || {}).id || null;
    v.kontajnery.forEach(kont => {
      box.appendChild(riadokKontajnera(kont, v, tu));
      const objekty = h("div", "objekty");
      kont.objekty.forEach(o => riadokObjektu(objekty, o, v, tu, kont.id, pozicie, prvyKontajner));
      if (kont.objekty.length) box.appendChild(objekty);
      else box.appendChild(h("div", "prazdno", "Kontajner zatiaľ nepriraďuje ani jeden objekt."));
    });
    // objekt, ktorý nenesie žiadny kontajner tejto výmeny — nález (C13), nie chyba stránky
    v.jednotky.forEach(o => riadokObjektu(box, o, v, tu, null, pozicie, prvyKontajner));
    if (!v.kontajnery.length && !v.jednotky.length) {
      box.appendChild(h("div", "prazdno", "Výmena zatiaľ nenesie ani jednu jednotku."));
    }
    return box;
  }

  /** Predvoľba: ohnisko sedí na tejto výmene (jednotka, kontajner, míľnik) → rozbalené; ohnisko na
      účele alebo udalosti → zbalené, tam chce čitateľ vidieť proces, nie špecifikáciu. Adresa
      (`?v=`) má prednosť, aby sa odkaz otvoril u adresáta rovnako. */
  function jeRozbalena(v, pozicie) {
    if (Array.isArray(STAV.vymenyRozbalene)) return STAV.vymenyRozbalene.indexOf(v.er.id) >= 0;
    return pozicie.some(p => p.vymena === v.er.id);
  }

  function prepniVymenu(v, r, pozicie) {
    const teraz = r.vymeny.filter(x => jeRozbalena(x, pozicie)).map(x => x.er.id);
    const i = teraz.indexOf(v.er.id);
    if (i >= 0) teraz.splice(i, 1); else teraz.push(v.er.id);
    naviguj({ vymenyRozbalene: teraz });
  }

  /** „používa aj UC-0201 …" — iný účel užitia, ktorý si výmenu berie ako vstup (U19 §4).
      Je to odkaz, nie ďalšia úloha: tie úlohy patria tomu druhému účelu. */
  function riadokPouzivaju(ucely) {
    const box = h("div", "pouziva-aj");
    box.appendChild(h("span", null, "používa aj"));
    ucely.forEach(u => {
      const b = h("button", "pouziva-aj-id");
      b.type = "button";
      b.textContent = u.id;
      b.title = u.nazov || u.id;
      b.addEventListener("click", () => otvorRetazec(u.id));
      box.appendChild(b);
    });
    return box;
  }

  /** Riadok kontajnera: vpravo formát (technické pole typu) a poskytovateľ z enginu. */
  function riadokKontajnera(kont, v, tu) {
    const popisTypu = TYPY[kont.typ] || { polia: [] };
    const vpravo = [POZNAMKY[kont.id] ? technickyUdaj(kont.id, popisTypu) : null, kont.popis]
      .filter(Boolean).join(" · ");
    return riadokStromu(kont, 0, {
      trieda: "jednotka" + (kont.id === tu ? " jednotka-ohnisko" : ""),
      vpravo,
      klik: () => { if (kont.id !== tu && POZNAMKY[kont.id]) otvorRetazec(kont.id); }
    });
  }

  /** Riadok objektu pod kontajnerom: vpravo profil geometrie · počet položiek · rozsah aspektov.
      Rozbalený je iba objekt v ohnisku, a to v tom kontajneri, cez ktorý je otvorený (V21, U12). */
  function riadokObjektu(box, o, v, tu, kontajner, pozicie, prvyKontajner) {
    const p = POZNAMKY[o.id];
    const popisTypu = TYPY[o.typ] || { polia: [] };
    const polePolozek = (popisTypu.polia || []).find(f => f.polozky);
    const tuCez = pozicie.some(x => x.kde === "jednotka" && x.vymena === v.er.id && x.kontajner === kontajner);
    const ohnisko = o.id === tu && tuCez && kontajner === prvyKontajner;
    const casti = [];
    if (p) {
      const profil = idZOdkazu(citaj(PRACOVNE[o.id], "/geometria/profil"));
      if (profil) casti.push(profil);
      if (polePolozek) casti.push(mnozne((citaj(PRACOVNE[o.id], "/" + polePolozek.kluc) || []).length, "položka", "položky", "položiek"));
    }
    if (o.rozsah && o.rozsah.length) casti.push(o.rozsah.join("+"));
    else if (!kontajner) casti.push("bez kontajnera");
    box.appendChild(riadokStromu(o, 0, {
      trieda: "jednotka" + (ohnisko ? " jednotka-ohnisko" : ""),
      vpravo: casti.join(" · "),
      klik: () => { if (!ohnisko && p) otvorRetazec(o.id); }
    }));
    if (ohnisko && p && polePolozek) {
      const telo = h("div", "jednotka-telo");
      telo.appendChild(tabulkaPoloziekPasma(o.id, polePolozek, v.er.id));
      box.appendChild(telo);
    }
  }
